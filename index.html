<div class="layout"><nav id="nav" aria-label="Secciones"></nav><main class="main" id="content"></main></div>

<script>
const contracts=[
 {
  "label": "Ficha del negocio",
  "summary": "Centralizar una vez la identidad del negocio que no pertenece a ninguna rama: nombre y zona horaria.",
  "input": {
   "url_negocio": "URL del negocio"
  },
  "instructions": "Tu propósito es crear la ficha del negocio: los datos de identidad que valen para todas las ramas y no deben repetirse después.\n\nCon url_negocio, identifica nombre_negocio y zona_horaria (IANA, por ejemplo Atlantic/Canary) con fuentes atribuibles: web del negocio, ficha pública tipo Google Maps u otra fuente oficial. Cita cada fuente. No inventes nombre ni zona.\n\nestado es completa si nombre y zona quedan sostenidos; pendiente si falta alguno esencial. No fixes el ámbito festivo (eso es Ámbito festivo). No busques enlaces de reserva (eso es Punto A). No armes la pila de cron (eso es Apertura). No listes teléfonos ni canales (eso es Contactos del negocio). No confirmes una reserva.\n\nRegistra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "estado": "completa | pendiente",
   "url_negocio": "URL del negocio",
   "nombre_negocio": "string | null",
   "zona_horaria": "IANA | null",

function icon(name){return '<span class="ico" aria-hidden="true">'+(iconSvg[name]||'')+'</span>'}
function isPlainObject(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function isNested(value){return value!==null&&typeof value==='object'}
function fieldLabel(key){return String(key).replaceAll('_',' ')}
function stateClass(value){
  const v=String(value);
  if(/pendiente|no_intentada|inconclusa|parcial/.test(v)) return 'warn';
  if(/^(no_|error)|requiere_revision|cambios_solicitados/.test(v)) return 'bad';
  if(/apta$|encontrad|identificado|generada|aprobada|fiable|referencia_completa|documentada|confirmada|habilitada/.test(v)) return 'ok';
  return '';
}
function caseHeading(obj){
  const preferred=['nombre_negocio','nombre','id_proceso','software','tipo','origen','fuente'];
  const parts=[];
  preferred.forEach(key=>{
    const value=obj[key];
    if(value!==null&&value!==undefined&&typeof value!=='object'){
      const text=String(value);
      if(text&&text.length<80) parts.push(text);
    }
  });
  const estadoKey=['estado','estado_generacion','estado_revision','fiabilidad','estado_sistema'].find(key=>obj[key]!==null&&obj[key]!==undefined&&typeof obj[key]!=='object'&&String(obj[key]).length<42);
  return {title:parts[0]||'',extra:parts[1]&&parts[1]!==parts[0]?parts[1]:'',estado:estadoKey?String(obj[estadoKey]):''};
}
function renderScalar(value){
  if(value===null||value===undefined||value==='') return '<span class="nullcell">vacío</span>';
  if(typeof value==='boolean') return value?'sí':'no';
  return escapeHtml(String(value));
}
function renderMeta(obj, keys){
  if(!keys.length) return '';
  return '<dl class="meta">'+keys.map(key=>{
    const value=obj[key];
    const text=value===null||value===undefined?'':String(value);
    const wide=text.length>72||/_md$|explicacion|motivo|mapeo|observacion|justificante/.test(key);
    return '<div class="metafield'+(wide?' wide':'')+'"><dt>'+escapeHtml(fieldLabel(key))+'</dt><dd>'+renderScalar(value)+'</dd></div>';
  }).join('')+'</dl>';
}
function renderChips(values){
  return '<ul class="chips">'+values.map(item=>'<li>'+renderScalar(item)+'</li>').join('')+'</ul>';
}
function renderValue(value){
  if(value===null||value===undefined) return '<p class="empty">Vacío</p>';
  if(Array.isArray(value)){
    if(!value.length) return '<p class="empty">Ninguno</p>';
    if(value.every(item=>isPlainObject(item))) return '<div class="caselist">'+value.map((item,index)=>renderCase(item,index,true)).join('')+'</div>';
    if(value.every(item=>item===null||typeof item!=='object')) return renderChips(value);
    return value.map(item=>'<div class="nestbody">'+renderValue(item)+'</div>').join('');
  }
  if(isPlainObject(value)) return renderCase(value,0,true);
  return renderScalar(value);
}
function renderNestedSection(key, value){
  const list=Array.isArray(value);
  const count=list?value.length:(isPlainObject(value)?1:0);
  const empty=value===null||value===undefined||(list&&!value.length);
  const hint=empty?'Nada dentro de este caso':(list?(count===1?'1 elemento dentro de este caso':count+' elementos dentro de este caso'):'Dentro de este caso');
  return '<section class="nestblock"><header class="nesthead">'+icon('nested')+'<div><h4>'+escapeHtml(fieldLabel(key))+'</h4><p>'+hint+'</p></div></header><div class="nestbody">'+(empty?'<p class="empty">Ninguno</p>':renderValue(value))+'</div></section>';
}
function renderCase(obj, index, inner){
  if(!obj||typeof obj!=='object'||Array.isArray(obj)) return renderValue(obj);
  const keys=Object.keys(obj);
  const meta=keys.filter(key=>obj[key]===null||typeof obj[key]!=='object');
  const nested=keys.filter(key=>obj[key]!==null&&typeof obj[key]==='object');
  const head=caseHeading(obj);
  const badge=head.estado?'<span class="state '+stateClass(head.estado)+'">'+escapeHtml(head.estado)+'</span>':'';
  const title=head.title?'<strong>'+escapeHtml(head.title)+'</strong>':'';
  const extra=head.extra?'<span class="caselabel">'+escapeHtml(head.extra)+'</span>':'';
  const label=inner?icon('case'):icon('case')+'<span>Caso '+(index+1)+'</span>';
  return '<article class="case'+(inner?' inner':'')+'"><header class="casehead"><span class="caselabel">'+label+'</span>'+title+extra+badge+'</header>'+renderMeta(obj, meta)+nested.map(key=>renderNestedSection(key, obj[key])).join('')+'</article>';
}
function joinScalars(arr){
  if(!Array.isArray(arr)||!arr.length) return '';
  return arr.map(v=>v===null||v===undefined?'':String(v)).filter(s=>s!=='').join(' · ');
}

function joinTyped(arr, keys){
  if(!Array.isArray(arr)||!arr.length) return '';
  return arr.map(item=>{
    if(!isPlainObject(item)) return String(item??'');
    return keys.map(k=>{
      const v=item[k];
      if(typeof v==='boolean') return v?'sí':'no';
      return v===null||v===undefined?'':String(v);
    }).join('|');
  }).join(' · ');
}

function emptyChildKeys(prefix, keys){
  const out={};
  keys.forEach(k=>{out[prefix+'_'+k]='';});
  return out;
}

function flattenPlainObject(obj, prefix){
  const out={};
  if(obj===null||obj===undefined){
    return out;
  }
  if(!isPlainObject(obj)){
    out[prefix]=obj;
    return out;
  }
  Object.keys(obj).forEach(k=>{
    const v=obj[k];
    const key=prefix?prefix+'_'+k:k;
    if(v===null||v===undefined){
      out[key]='';
    }else if(Array.isArray(v)){
      if(!v.length) out[key]='';
      else if(v.every(item=>item===null||typeof item!=='object')) out[key]=joinScalars(v);
      else out[key]=JSON.stringify(v);
    }else if(isPlainObject(v)){
      Object.assign(out, flattenPlainObject(v, key));
    }else{
      out[key]=v;
    }
  });
  return out;
}

function pathGet(obj, path){
  let cur=obj;
  for(const p of path){
    if(cur===null||cur===undefined) return undefined;
    cur=cur[p];
  }
  return cur;
}

function flattenFuncionJson(fj, out){
  if(!fj||!isPlainObject(fj)){
    out.funcion_name='';
    out.funcion_parameters='';
    out.response_estado='';
    out.response_referencia='';
    out.response_alternativas='';
    out.response_motivo='';
    return;
  }
  out.funcion_name=fj.name??'';
  const params=Array.isArray(fj.parameters)?fj.parameters:[];
  out.funcion_parameters=joinTyped(params, ['nombre','tipo','obligatorio']);
  const resp=fj.response&&isPlainObject(fj.response)?fj.response:{};
  out.response_estado=resp.estado??'';
  out.response_referencia=resp.referencia??'';
  out.response_alternativas=joinScalars(resp.alternativas||[]);
  out.response_motivo=resp.motivo??'';
}

}

function flattenCaseBase(label, side, caso, casoIdx, grain){
  const out={caso_idx:casoIdx};
  const skip=new Set();

  // Determine unnest key to skip
  let unnestKey=null;
  if(grain.unnest) unnestKey=grain.unnest;
  if(grain.unnestPath) unnestKey=grain.unnestPath[0]; // skip top container partially

  if(label==='Canal de cancelación'&&side==='output'){
    // Special structured flatten
    out.id_proceso=caso.id_proceso??'';
    out.estado=caso.estado??'';
    const busq=caso.busqueda_realizada||{};
    out.busqueda_fuentes_consultadas=joinScalars(busq.fuentes_consultadas||[]);
    out.busqueda_opciones_revisadas=joinScalars(busq.opciones_revisadas||[]);
    out.busqueda_limitaciones=joinScalars(busq.limitaciones||[]);
    const sist=caso.cancelacion_sistema||{};
    out.sistema_disponible=sist.disponible??'';
    out.sistema_metodo=sist.metodo??'';

  Object.keys(caso).forEach(key=>{

      }else{
        return; // skip unnest array
      }

    if(grain.unnest&&key===grain.unnest) return;

    const v=caso[key];
    if(v===null||v===undefined){
      out[key]='';
    }else if(Array.isArray(v)){
      if(!v.length) out[key]='';
      else if(v.every(item=>item===null||typeof item!=='object')) out[key]=joinScalars(v);

      }
    }else{
      out[key]=v;
    }
  });

  // For Canal we returned early. For Verificación with unnest alertas, skip alertas in base:
  if(grain.unnest==='alertas') delete out.alertas;

  return out;
}

function getUnnestItems(caso, grain){
  if(grain.unnestPath){
    const items=pathGet(caso, grain.unnestPath);
    return Array.isArray(items)?items:[];
  }
  if(grain.unnest){
    const items=caso[grain.unnest];
    return Array.isArray(items)?items:[];
  }
  return null; // no unnest
}

function flattenChild(item, prefix, childKeys){
  if(!item||!isPlainObject(item)){
    if(childKeys&&childKeys.length) return emptyChildKeys(prefix, childKeys);
    return {};
  }
  if(childKeys&&childKeys.length){
    const out={};
    childKeys.forEach(k=>{
      const v=item[k];
      out[prefix+'_'+k]=(v===null||v===undefined)?'':v;
    });
    // also include any extra keys on the item
    Object.keys(item).forEach(k=>{
      if(childKeys.includes(k)) return;
      const v=item[k];
      const key=prefix+'_'+k;
      if(v===null||v===undefined) out[key]='';
      else if(Array.isArray(v)) out[key]=joinScalars(v);
      else if(isPlainObject(v)) Object.assign(out, flattenPlainObject(v, key));
      else out[key]=v;
    });
    return out;
  }
  // Output combinado procesos: flatten all keys with proceso_ prefix, join scalar arrays
  const out={};
  Object.keys(item).forEach(k=>{
    const v=item[k];
    const key=prefix+'_'+k;
    if(v===null||v===undefined) out[key]='';
    else if(Array.isArray(v)) out[key]=joinScalars(v);
    else if(isPlainObject(v)) Object.assign(out, flattenPlainObject(v, key));
    else out[key]=v;
  });
  return out;
}

function flattenExample(label, side, rows){
  const sideKey=side===0||side==='input'?'input':'output';
  const cfg=EXAMPLE_GRAIN[label]||{};
  const grain=cfg[sideKey]||{hint:'Cada fila es 1 caso; el Markdown se abre con Ver Markdown.'};
  const flatRows=[];
  (rows||[]).forEach((caso, idx)=>{
    const base=flattenCaseBase(label, sideKey, caso, idx+1, grain);
    const items=getUnnestItems(caso, grain);
    if(items===null){
      flatRows.push(base);
      return;
    }
    if(!items.length){
      const child=grain.childKeys?emptyChildKeys(grain.prefix, grain.childKeys):(grain.prefix?{[grain.prefix]:''}:{});
      // For Output combinado empty procesos, leave proceso_* empty — discover keys from sibling cases later
      flatRows.push(Object.assign({}, base, child));
      return;
    }
    items.forEach(item=>{
      flatRows.push(Object.assign({}, base, flattenChild(item, grain.prefix, grain.childKeys)));
    });
  });

  // For Output combinado empty-proceso rows, ensure proceso_* columns exist from other rows
  if(label==='Output combinado'&&sideKey==='output'){
    const procKeys=new Set();
    flatRows.forEach(r=>Object.keys(r).filter(k=>k.startsWith('proceso_')).forEach(k=>procKeys.add(k)));
    flatRows.forEach(r=>{
      procKeys.forEach(k=>{if(!(k in r)) r[k]='';});
    });
  }

  return {rows:flatRows, hint:grain.hint||'Cada fila es 1 caso; el Markdown se abre con Ver Markdown.', grain};
}

function collectHeaders(rows){
  const order=[];
  const seen=new Set();
  rows.forEach(r=>{
    Object.keys(r).forEach(k=>{
      if(!seen.has(k)){seen.add(k);order.push(k);}
    });
  });
  // prefer caso_idx first
  const idx=order.indexOf('caso_idx');
  if(idx>0){order.splice(idx,1);order.unshift('caso_idx');}
  return order;
}

function isMdColumn(key){
  return /_md$/.test(key) || key==='script_contenido';
}
function exampleCellHtml(key, value, row){
  if(isMdColumn(key)){
    const raw=(value===null||value===undefined)?'':String(value);
    if(!raw) return '<span class="nullcell"></span>';
    const title=row.estado||row.estado_generacion||row.estado_revision||row.nombre_negocio||row.id_proceso||row.software||key;
    const meta=['caso '+(row.caso_idx||''), key].filter(Boolean).join(' · ');
    return mdCapsule(String(title), raw, meta);
  }
  if(value===null||value===undefined||value==='') return '<span class="nullcell"></span>';
  if(typeof value==='boolean') return value?'sí':'no';
  return escapeHtml(String(value));
}
function exampleFlatTable(rows){
  if(!rows||!rows.length) return '<p class="empty">Ninguno</p>';
  const headers=collectHeaders(rows);
  const th=headers.map(h=>'<th>'+escapeHtml(h)+'</th>').join('');
  const body=rows.map(r=>'<tr>'+headers.map(h=>'<td>'+exampleCellHtml(h, r[h], r)+'</td>').join('')+'</tr>').join('');
  return '<div class="tablewrap"><table class="flatTable example-flat"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

}

function renderRecordTable(data){
  if(!Array.isArray(data)||!data.length) return '<p class="empty">Ninguno</p>';
  if(data.every(item=>isPlainObject(item))) return '<div class="caselist">'+data.map((item,index)=>renderCase(item,index,false)).join('')+'</div>';

function loadExampleRows(label, schema, rows){
  const data=rows||outputExamples[label];
  if(!data||!data.length) throw new Error('Sin ejemplos para '+label);
  const columns=Object.keys(schema);
  data.forEach((row,i)=>{
    columns.forEach(c=>{ if(!Object.prototype.hasOwnProperty.call(row,c)) throw new Error('Falta '+c+' en '+label+' fila '+i); });
    Object.keys(row).forEach(k=>{ if(!columns.includes(k)) throw new Error('Campo extra '+k+' en '+label); });
  });
  return data;
}
function exampleSection(label, schema, rows){
  const data=loadExampleRows(label, schema, rows);

  return '<section class="card"><h3 class="h-ico">'+icon('examples')+'Ejemplo guardado</h3><p class="intro">'+escapeHtml(painted.hint)+'</p>'+painted.html+'</section>';
}

function mountFlowMermaid(){

  try{

    mermaid.run({nodes:[el]}).then(()=>{

      const byText={
        'Ficha del negocio':'Ficha del negocio','Ámbito festivo':'Ámbito festivo','Punto A':'Punto A','Apertura':'Apertura',

      };
      el.querySelectorAll('.node').forEach(node=>{
        const raw=(node.textContent||'').replace(/\s+/g,' ').trim();

        for (const [text,lab] of Object.entries(byText)){
          if(raw.includes(text)){ if(lab===null) goCierre=true; else label=lab; break; }

function resolveDbEntityLabel(raw){
  const t=(raw||'').replace(/\s+/g,' ').trim();
  if(!t) return null;
  for (const [key,lab] of Object.entries(dbEntityToTab)){
    if(t===key || t.startsWith(key+' ') || t.includes(key)){
      // Prefer exact entity title match at start of block text
      if(t===key || t.startsWith(key)) return lab;
    }
  }
  // First token often is entity name
  const first=t.split(/\s+/)[0];
  return dbEntityToTab[first]||null;
}

function setupDbZoomPan(){
  const viewport=document.getElementById('dbViewport');
  const stage=document.getElementById('dbStage');
  const el=document.getElementById('dbMermaid');
  const pctEl=document.getElementById('dbZoomPct');
  if(!viewport||!stage||!el) return;
  const svg=el.querySelector('svg');
  if(!svg) return;

  let scale=1, tx=0, ty=0;
  let fitScale=1;
  const minScale=0.25, maxScale=2.5;

  const natural=()=>{
    const bbox=svg.getBBox();
    // prefer explicit pixel size if present
    const w=Math.max(bbox.width||0, svg.scrollWidth||0, parseFloat(svg.getAttribute('width'))||0, 1);
    const h=Math.max(bbox.height||0, svg.scrollHeight||0, parseFloat(svg.getAttribute('height'))||0, 1);
    return {w,h,bbox};
  };

  const apply=()=>{
    stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    if(pctEl) pctEl.textContent=Math.round(scale*100)+'%';
  };

  const fit=()=>{
    const {w,h,bbox}=natural();
    const pad=20;
    const vw=Math.max(1, viewport.clientWidth-pad*2);
    const vh=Math.max(1, viewport.clientHeight-pad*2);
    fitScale=Math.min(vw/w, vh/h, 1);
    // Start slightly able to see whole diagram: never above fit
    scale=Math.max(minScale, fitScale);
    // Center content. SVG may have negative bbox origin.
    const ox=bbox.x||0, oy=bbox.y||0;
    tx=pad+(vw-w*scale)/2 - ox*scale;
    ty=pad+(vh-h*scale)/2 - oy*scale;
    apply();
  };

  const zoomBy=(factor, cx, cy)=>{
    const rect=viewport.getBoundingClientRect();
    const pivotX=(cx!=null?cx:rect.left+rect.width/2)-rect.left;
    const pivotY=(cy!=null?cy:rect.top+rect.height/2)-rect.top;
    const next=Math.min(maxScale, Math.max(minScale, scale*factor));
    if(next===scale) return;
    // Keep point under cursor stable
    const wx=(pivotX-tx)/scale;
    const wy=(pivotY-ty)/scale;
    scale=next;
    tx=pivotX-wx*scale;
    ty=pivotY-wy*scale;
    apply();
  };

  content.querySelectorAll('[data-db-zoom]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const a=btn.dataset.dbZoom;
      if(a==='in') zoomBy(1.2);
      else if(a==='out') zoomBy(1/1.2);
      else if(a==='fit') fit();
    });
  });

  // Pan (desktop + touch via pointer events); protect entity clicks
  let panning=false, startX=0, startY=0, originTx=0, originTy=0;
  window.__dbPanMoved=false;
  viewport.addEventListener('pointerdown',ev=>{
    if(ev.button!=null && ev.button!==0) return;
    panning=true;
    window.__dbPanMoved=false;
    startX=ev.clientX; startY=ev.clientY;
    originTx=tx; originTy=ty;
    viewport.classList.add('is-panning');
    try{viewport.setPointerCapture(ev.pointerId)}catch(_){}
  });
  viewport.addEventListener('pointermove',ev=>{
    if(!panning) return;
    const dx=ev.clientX-startX, dy=ev.clientY-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4) window.__dbPanMoved=true;
    tx=originTx+dx; ty=originTy+dy;
    apply();
  });
  const endPan=ev=>{
    if(!panning) return;
    panning=false;
    viewport.classList.remove('is-panning');
    try{viewport.releasePointerCapture(ev.pointerId)}catch(_){}
    // Clear flag after click handlers run
    setTimeout(()=>{window.__dbPanMoved=false},0);
  };
  viewport.addEventListener('pointerup',endPan);
  viewport.addEventListener('pointercancel',endPan);

  // Wheel zoom (optional nicety)
  viewport.addEventListener('wheel',ev=>{
    if(ev.ctrlKey||ev.metaKey||Math.abs(ev.deltaY)>0){
      ev.preventDefault();
      const factor=ev.deltaY<0?1.1:1/1.1;
      zoomBy(factor, ev.clientX, ev.clientY);
    }
  },{passive:false});

  // Initial fit after layout
  requestAnimationFrame(()=>requestAnimationFrame(fit));
  window.addEventListener('resize',()=>{ /* soft refit only if near fit */ },{once:true});
}

function tabStripKey(row){
  return row.getAttribute('aria-label')||row.id||row.className||'tabstrip';
}
function snapshotTabScrolls(root){
  const map={};
  (root||content).querySelectorAll('.tabs, .sidetabs').forEach(row=>{
    map[tabStripKey(row)]=row.scrollLeft;
  });
  return map;
}
function restoreTabScrolls(map, root){
  if(!map) return;
  (root||content).querySelectorAll('.tabs, .sidetabs').forEach(row=>{
    const key=tabStripKey(row);
    if(Object.prototype.hasOwnProperty.call(map,key)) row.scrollLeft=map[key];
  });
}
function tabOffsetInStrip(tab, row){
  const rowRect=row.getBoundingClientRect();
  const tabRect=tab.getBoundingClientRect();
  return tabRect.left-rowRect.left+row.scrollLeft;
}
function ensureActiveTabVisible(row){
  if(!row) return;
  const active=row.querySelector('button[aria-selected="true"]');
  if(!active) return;
  const pad=16;
  const maxScroll=Math.max(0, row.scrollWidth-row.clientWidth);
  if(maxScroll===0) return;
  const left=tabOffsetInStrip(active, row);
  const right=left+active.offsetWidth;
  const viewLeft=row.scrollLeft;
  const viewRight=viewLeft+row.clientWidth;
  if(left>=viewLeft+pad && right<=viewRight-pad) return;
  const centered=left-(row.clientWidth-active.offsetWidth)/2;
  row.scrollLeft=Math.min(maxScroll, Math.max(0, centered));
}
function ensureAllActiveTabsVisible(root){
  (root||content).querySelectorAll('.tabs, .sidetabs').forEach(ensureActiveTabVisible);
}
function restoreOpsScroll(pageY, tabScrolls){
  const apply=()=>{
    if(tabScrolls) restoreTabScrolls(tabScrolls);
    if(pageY!=null) window.scrollTo(0, pageY);
    ensureAllActiveTabsVisible();
    const active=content.querySelector('.tabs button[aria-selected="true"]');
    if(active) active.focus({preventScroll:true});
  };
  apply();
  requestAnimationFrame(()=>requestAnimationFrame(apply));
}
function afterTabRender(opts){
  const o=opts||{};
  const apply=()=>{
    if(o.tabScrolls) restoreTabScrolls(o.tabScrolls);
    if(o.pageY!=null) window.scrollTo(0, o.pageY);
    ensureAllActiveTabsVisible();
    if(o.focusActive){
      const active=content.querySelector('.tabs button[aria-selected="true"]');
      if(active) active.focus({preventScroll:true});
    }
  };
  apply();
  requestAnimationFrame(()=>requestAnimationFrame(apply));
}

  const contrato=`<div id="panel-vista" role="tabpanel"><section class="card"><h3 class="h-ico">${icon('input')} Input</h3><pre>${escapeHtml(JSON.stringify(d.input,null,2))}</pre></section><section class="card prompt"><div class="prompthead"><h3 class="h-ico">${icon('instructions')} Instrucciones</h3><button class="copy" type="button" id="copyPrompt">Copiar</button></div><p class="prompttext">${escapeHtml(d.instructions)}</p></section><section class="card"><h3 class="h-ico">${icon('output')} Output</h3><pre>${escapeHtml(JSON.stringify(d.output,null,2))}</pre></section></div>`;
  const revision=`<div id="panel-vista" role="tabpanel"><p class="intro">${escapeHtml(d.review.intro)}</p><section class="card"><h3>Veredicto</h3><pre>${escapeHtml(JSON.stringify(validationOutput,null,2))}</pre></section>${exampleSection('Output de la revisión', validationOutput)}</div>`;
  const exampleRows=contractExample===0?inputExamples[d.label]:outputExamples[d.label];

  const panel=contractView===0?contrato:(contractView===1?revision:examples);

  bindTabs('contratos',i=>{contractTab=i;renderOperaciones({preserveScroll:true})});
  content.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{contractView=Number(b.dataset.view);renderOperaciones({preserveScroll:true})}));
  content.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{contractExample=Number(b.dataset.side);contractView=2;renderOperaciones({preserveScroll:true})}));
  const copy=document.getElementById('copyPrompt');
  if(copy) copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.instructions);copy.textContent='Copiado'}catch(e){const t=document.createElement('textarea');t.value=d.instructions;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();copy.textContent='Copiado'}};
  bindMdCapsules(content);
  if(preserveScroll) restoreOpsScroll(pageY, tabScrolls);
  else afterTabRender({tabScrolls, focusActive:true});
}

}
function clasificarVias(automatica,asistida){

 if(automatica==='apta')return 'apto_automatico';

}

function mdCapsule(title, md, meta){
  const id='md-'+Math.random().toString(36).slice(2,10);
  window.__mdDocs=window.__mdDocs||{};
  window.__mdDocs[id]={title:title||'Documento', md:md||'', meta:meta||''};
  return `<button type="button" class="md-capsule" data-md-id="${id}"><span class="cap-ico" aria-hidden="true">${iconSvg.markdown}</span>Ver Markdown</button>`;
}
function openMdModal(id){
  const doc=(window.__mdDocs||{})[id];
  if(!doc) return;
  let modal=document.getElementById('mdModal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='mdModal';
    modal.className='md-modal';
    modal.innerHTML='<div class="md-modal-card" role="dialog" aria-modal="true" aria-labelledby="mdModalTitle"><header><div><h3 id="mdModalTitle"></h3><p id="mdModalMeta"></p></div><button type="button" class="md-modal-close" id="mdModalClose">Cerrar</button></header><pre class="md-body" id="mdModalBody"></pre></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click',ev=>{if(ev.target===modal) modal.classList.remove('open');});
    document.getElementById('mdModalClose').onclick=()=>modal.classList.remove('open');
  }
  modal.querySelector('#mdModalTitle').textContent=doc.title;
  modal.querySelector('#mdModalMeta').textContent=doc.meta||'';
  modal.querySelector('#mdModalBody').textContent=doc.md||'';
  modal.classList.add('open');
}
function flatTable(headers, rows, mdField){
  const show=headers.filter(h=>h!==mdField);
  if(mdField) show.push('documento');
  const th=show.map(h=>`<th>${escapeHtml(h)}</th>`).join('');
  const body=rows.map(r=>{
    const cells=headers.filter(h=>h!==mdField).map(h=>`<td>${escapeHtml(String(r[h]??'—'))}</td>`);
    if(mdField){
      const title=r.resumen||r.estado||r.id||r.id_integracion||'Documento';
      const meta=[r.id_integracion||r.id,r.version,r.timestamp].filter(Boolean).join(' · ');
      cells.push(`<td>${mdCapsule(String(title), String(r[mdField]||''), meta)}</td>`);
    }
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bindMdCapsules(root){
  (root||document).querySelectorAll('[data-md-id]').forEach(b=>b.addEventListener('click',()=>openMdModal(b.dataset.mdId)));
}
function schemaTable(rows){
  return flatTable(['campo','caracteristicas'], rows);
}

function puntaTag(p){
  if(p.nota) return `<span class="punta-tag note">${escapeHtml(p.nota)}</span>`;
  if(p.estable===true) return '<span class="punta-tag ok">estable</span>';
  if(p.estable===false) return '<span class="punta-tag no">no estable</span>';
  return '';
}
function estabChips(list, kind){
  if(!list||!list.length) return '<span class="estab-empty">—</span>';
  return '<span class="estab-chips">'+list.map(x=>`<span class="estab-chip${kind==='no'?' no':''}">${escapeHtml(x)}</span>`).join('')+'</span>';
}
function catalogTabIndex(label){
  return catalogTabs.findIndex(t=>t.label===label);
}
function catalogTabMeta(label){
  const i=catalogTabIndex(label);
  if(i<0) return null;
  return {index:i, ...catalogTabs[i]};
}
function enlaceCard(name, opts={}){
  const meta=name?catalogTabMeta(name):null;
  if(!meta){
    return '<li><div class="enlace-card empty" aria-hidden="true">—</div></li>';
  }
  const cls=opts.esta?'enlace-card esta':'enlace-card';
  const ico=meta.icon?icon(meta.icon):'';
  return `<li><button type="button" class="${cls}" data-cat-goto="${meta.index}">${ico}<span>${escapeHtml(meta.label)}</span></button></li>`;
}
function enlaceColumn(title, names, opts={}){
  let cards='';
  if(opts.esta){
    cards=enlaceCard(names, {esta:true});
  }else if(!names||!names.length){
    cards=enlaceCard(null);
  }else{
    cards=names.map(n=>enlaceCard(n)).join('');
  }
  return `<div class="enlace-col"><h5 class="enlace-col-h">${escapeHtml(title)}</h5><ul class="enlace-cards">${cards}</ul></div>`;
}
function combinaEnlace(c){
  const e=c.enlace||{padre:[],esta:c.esta||'',hijas:[]};
  return `<div class="enlace-kanban" role="group" aria-label="Enlace Padre Esta Hijas">
${enlaceColumn('Padre', e.padre)}
${enlaceColumn('Esta', e.esta, {esta:true})}
${enlaceColumn('Hijas', e.hijas)}
</div>`;
}
function combinaBlock(label){
  const c=catalogCombina[label];
  if(!c) return '';
  const v=combinaView;
  const puntas=(c.puntas||[]).map(p=>`<li class="punta"><span class="punta-name">${escapeHtml(p.campo)}</span>${puntaTag(p)}</li>`).join('');
  const nota=c.notaEstable?`<p class="intro" style="margin:4px 0 0">${escapeHtml(c.notaEstable)}</p>`:'';
  const panels=[
    `<ul class="puntas-row">${puntas}</ul>`,
    combinaEnlace(c),
    `<p class="porque-text">${escapeHtml(c.porQue)}</p>`,
    `<div class="estab"><div class="estab-line"><span class="estab-k">Estable:</span>${estabChips(c.estable,'ok')}</div><div class="estab-line"><span class="estab-k">No estable:</span>${estabChips(c.noEstable,'no')}</div>${nota}</div>`
  ];
  const tabsHtml=`<div class="sidetabs" role="tablist" aria-label="Vista de Combina">
<button type="button" role="tab" aria-selected="${v===0}" data-combina-view="0">${icon('puntas')} Puntas</button>
<button type="button" role="tab" aria-selected="${v===1}" data-combina-view="1">${icon('enlace')} Enlace</button>
<button type="button" role="tab" aria-selected="${v===2}" data-combina-view="2">${icon('porque')} Por qué</button>
<button type="button" role="tab" aria-selected="${v===3}" data-combina-view="3">${icon('estabilidad')} Estabilidad</button>
</div>`;
  return `<section class="combina" aria-label="Combina">
<h4>${icon('combina')} Combina</h4>
<hr class="combina-rule">
${tabsHtml}
<div class="combina-panel" role="tabpanel">${panels[v]||panels[0]}</div>
</section>`;
}
function renderCatalogos(){
  const tab=catalogTabs[catalogTab];
  const label=tab.label;
  const tabIcon=tab.icon?icon(tab.icon):'';
  const combina=combinaBlock(label);
  const inner=`<div class="sidetabs" role="tablist" aria-label="Vista de la tabla"><button type="button" role="tab" aria-selected="${catalogInnerView===0}" data-cat-inner="0">${icon('esquema')} Esquema</button><button type="button" role="tab" aria-selected="${catalogInnerView===1}" data-cat-inner="1">${icon('examples')} Ejemplos</button></div>`;
  let body='';
  if(catalogInnerView===0){
    body=`<p class="intro">Campos de la tabla <strong>${escapeHtml(label)}</strong>.</p>${schemaTable(catalogSchemas[label])}`;
  }else if(label==='Negocio'){
    body=`<p class="intro">Una fila por negocio.</p>${flatTable(['id_negocio','url','nombre','zona','ambito_festivo','actualizado_en'],catalogNegocio)}`;
  }else if(label==='Software'){
    body=`<p class="intro">Una fila por proveedor.</p>${flatTable(['id_software','nombre','primera_vez','actualizado_en'],catalogSoftware)}`;
  }else if(label==='Integración'){
    body=`<p class="intro">Una fila por versión. El Markdown se abre con la cápsula.</p>${flatTable(['id_integracion','id_software','version','timestamp','estado','resumen','documentacion_md'],catalogIntegracion,'documentacion_md')}`;
  }else if(label==='Proceso'){
    body=`<p class="intro">Solo identidad del proceso. Los artefactos viven en sus propias tablas.</p>${flatTable(['id_proceso','id_negocio','url_inicio','alcance','id_software','actualizado_en'],catalogProcesoIdentidad)}`;
  }else if(label==='Observación'||label==='Justificante'||label==='Función'||label==='Script'||label==='Canal'){
    const art=catalogProcesoArtefactos[label];
    body=`<p class="intro">Una fila por versión. Regenerar añade versión; no sobrescribe la identidad del proceso.</p>${flatTable(['id','id_proceso','version','timestamp','estado','resumen','documento_md'],art,'documento_md')}`;
  }else if(label==='Ejecución'){
    body=`<p class="intro">Una fila por intento.</p>${flatTable(['id_ejecucion','id_proceso','via','timestamp','resultado','id_referencia'],catalogEjecucion)}`;
  }
  const panel=`<div class="catalog-panel"><h3 class="catalog-title">${tabIcon}${escapeHtml(label)}</h3>${combina}<section class="card">${inner}${body}</section></div>`;
  const tabScrolls=snapshotTabScrolls();
  const pageY=window.scrollY||window.pageYOffset||0;
  content.innerHTML=heading('Capas de datos','Modelo de datos','Tablas del modelo: esquema y ejemplos. Filas planas; el Markdown se abre en cápsula.','Modelo')+tabs(catalogTabs,catalogTab,'modelo')+`<div id="panel-modelo">${panel}</div>`;
  bindTabs('modelo',i=>{catalogTab=i;catalogInnerView=0;combinaView=0;renderCatalogos()});
  content.querySelectorAll('[data-cat-inner]').forEach(b=>b.addEventListener('click',()=>{catalogInnerView=Number(b.dataset.catInner);renderCatalogos()}));
  content.querySelectorAll('[data-combina-view]').forEach(b=>b.addEventListener('click',()=>{combinaView=Number(b.dataset.combinaView);renderCatalogos()}));
  content.querySelectorAll('[data-cat-goto]').forEach(b=>b.addEventListener('click',()=>{catalogTab=Number(b.dataset.catGoto);catalogInnerView=0;combinaView=0;renderCatalogos()}));
  bindMdCapsules(content);
  afterTabRender({tabScrolls, pageY, focusActive:true});
}
const sections=[['Mapa',renderMapa],['Operaciones',renderOperaciones],['Modelo de datos',renderCatalogos]];
function render(){document.getElementById('nav').innerHTML='<div class="navtitle">Arquitectura</div>'+sections.map(([label],i)=>`<button type="button" class="${section===i?'active':''}" aria-current="${section===i?'page':'false'}" data-section="${i}"><span class="num">${i+1}</span>${label}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{section=Number(b.dataset.section);render();window.scrollTo({top:0,behavior:'smooth'})}));sections[section][1]()}
render();
</script>
