<header><div class="brand"><span class="brandmark" aria-hidden="true">▣</span><div><h1>Arquitectura de reservas web</h1><p>Punto A · lecturas en paralelo · función y script · dos vías · compuerta</p></div></div></header>
<div class="layout"><nav id="nav" aria-label="Secciones"></nav><main class="main" id="content"></main></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const contracts=[
 {
  "label": "Punto A",
  "summary": "Localizar cada enlace donde el negocio empieza una reserva.",
  "input": {
   "url_negocio": "URL del negocio"
  },
  "instructions": "Localiza cada enlace en el que el negocio empieza una reserva. Explora la web y los destinos a los que conduce, incluidos widgets o servicios externos. Para cada inicio registra id_proceso, url_inicio y alcance. Separa procesos con enlace o cobertura distinta; agrupa accesos que abren el mismo inicio y explica por qué. No identifiques software, no recorras el formulario y no busques cancelación, horario ni vías. Usa no_encontrada solo si la exploración basta para sostener que no hay reserva online. Bloqueo, web a medias o falta de acceso, datos o evidencia es pendiente. No confundas no haber hallado un enlace con haber confirmado que no existe. El resultado de negocio es sin_reserva_online o pendiente, nunca no_apto. No inventes enlaces ni contactos. No confirmes una reserva. Registra fecha_evaluacion y deja fecha_validacion vacía hasta que la revisión independiente sea concluyente.",
  "output": {
   "estado": "encontrada | no_encontrada | pendiente",
   "nombre_negocio": "string | null",
   "procesos": [
    {
     "id_proceso": "Identificador del proceso",
     "url_inicio": "URL de inicio de la reserva",
     "alcance": "Reservas que cubre"
    }
   ],
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion": "string"
  }
 },
 {
  "label": "Identificar software",
  "summary": "Decir qué software usa el enlace de inicio y con qué señal directa.",
  "input": {
   "id_proceso": "Identificador del proceso",
   "url_inicio": "URL de inicio de la reserva"
  },
  "instructions": "Identifica el software de este enlace de inicio y la señal directa que lo sostiene. Trabaja solo con id_proceso y url_inicio; no uses el expediente de Punto A. Revisa recursos, dominios, código visible, llamadas de red, textos y comportamiento del widget. No te limites a una lista fija de proveedores. Por cada software registra nombre, función observada y evidencias con origen exacto, fragmento observado y por qué une ese software a este proceso. Distingue evidencia directa de indicios débiles. Un logo aislado, una mención incidental o un script ajeno no bastan. Si hay varios componentes, explica la función de cada uno. Usa identificado cuando la atribución se sostiene con evidencia directa; no_identificado si la búsqueda fue suficiente y no hay proveedor atribuible; pendiente si la búsqueda quedó a medias. No investigues la integración, no definas la función y no generes script. No inventes proveedores. No evadas controles. No confirmes una reserva. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "id_proceso": "Identificador del proceso",
   "estado": "identificado | no_identificado | pendiente",
   "software_identificado": [
    {
     "nombre": "string",
     "funcion_observada": "string",
     "evidencias": [
      {
       "origen": "URL o recurso",
       "fragmento": "Señal observada",
       "explicacion": "Cómo sustenta la atribución"
      }
     ]
    }
   ],
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion": "string"
  }
 },
 {
  "label": "Observar formulario",
  "summary": "Recorrer el enlace de inicio hasta justo antes de confirmar y relatar lo visto.",
  "input": {
   "id_proceso": "Identificador del proceso",
   "url_inicio": "URL de inicio de la reserva"
  },
  "instructions": "Recorre url_inicio paso a paso hasta justo antes de confirmar. Relata en el orden observado lo visible y lo comprobable de su construcción: código, peticiones, validaciones, dependencias, mensajes, comportamientos y capturas. No uses plantilla ni lista previa de atributos. El relato va en observacion_formulario_md; cada evidencia cita origen, fragmento y explicación. No decidas campos, no escribas justificante, no generes funcion.json ni código. No pulses la acción que enviaría o confirmaría una reserva. No confirmes sin evidencia. No evadas controles. No esperes al software ni a la integración. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "id_proceso": "Identificador del proceso",
   "observacion_formulario_md": "Informe Markdown narrativo de hechos observados; sin decisiones ni plantilla de atributos",
   "evidencias": [
    {
     "origen": "URL o recurso",
     "fragmento": "Señal observada",
     "explicacion": "Qué hecho del relato sostiene"
    }
   ],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion": "string"
  }
 },
 {
  "label": "Canal de cancelación",
  "summary": "Averiguar cómo se cancelaría una reserva de este proceso y qué canal verificable ofrece el negocio.",
  "input": {
   "id_proceso": "Identificador del proceso",
   "url_inicio": "URL de inicio de la reserva",
   "url_negocio": "URL del negocio",
   "software": "nombre | null"
  },
  "instructions": "Averigua cómo se cancelaría una reserva de este proceso y qué canal verificable permitiría gestionarla. Empieza con id_proceso, url_inicio y url_negocio. El nombre de software, si llega, es una pista: no es requisito para empezar y no esperes a la integración. Revisa primero las opciones del propio sistema: enlace o instrucciones de cancelación, gestión desde la confirmación o el área de reservas, u operación oficial si la pista de software la señala. Después busca canales publicados por el negocio en fuentes oficiales o en una ficha pública que controle. Registra cada canal con valor, fuente, fecha y evidencia. Distingue fijo de móvil solo si la fuente o una clasificación fiable lo sostiene. Marca WhatsApp solo cuando el negocio lo identifica como tal; un número no demuestra WhatsApp. Diferencia cancelación directa de una solicitud al negocio. Un canal de contacto puede servir para solicitarla y no demuestra que la petición se haya recibido o ejecutado. Documenta fuentes, opciones y limitaciones en busqueda_realizada. Recoge plazo, coste, penalización o garantía de tarjeta cuando se publiquen. Elige canal_preferido entre opciones cuya utilidad esté respaldada: primero el mecanismo del sistema, después un canal escrito y al final una llamada. Usa encontrado si hay al menos una vía útil verificada; no_encontrado si la búsqueda de fuentes y opciones razonables fue suficiente y no apareció ninguna vía verificable; pendiente si quedó incompleta. no_encontrado es el resultado de una búsqueda documentada, no una prueba de inexistencia. no_encontrado bloquea el envío real con motivo sin_canal_de_cancelacion y no convierte la vía en no_apta. No inventes contactos. No des por cancelada una reserva sin confirmación verificable. No confirmes una reserva. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "id_proceso": "Identificador del proceso",
   "estado": "encontrado | no_encontrado | pendiente",
   "busqueda_realizada": {
    "fuentes_consultadas": [],
    "opciones_revisadas": [],
    "limitaciones": []
   },
   "cancelacion_sistema": {
    "disponible": "si | no | desconocido",
    "metodo": "string | null",
    "url_o_instrucciones": "string | null",
    "evidencias": [
     {
      "fuente": "URL o recurso",
      "fecha_consulta": "ISO 8601",
      "fragmento": "string"
     }
    ]
   },
   "canales_contacto": [
    {
     "tipo": "whatsapp | telefono | email | formulario",
     "valor": "string",
     "tipo_linea": "movil | fijo | no_aplica | desconocido",
     "uso_publicado": "contacto | cancelaciones | desconocido",
     "verificado_como_contacto": "boolean",
     "uso_cancelacion": "cancelacion_directa | solicitar_al_negocio | no_verificado",
     "fuente": "URL",
     "fecha_consulta": "ISO 8601",
     "evidencia": "string"
    }
   ],
   "canal_preferido": {
    "tipo": "string | null",
    "valor": "string | null",
    "metodo": "string | null",
    "motivo": "string | null"
   },
   "politica_cancelacion": {
    "resumen": "string | null",
    "plazo": "string | null",
    "coste_o_penalizacion": "string | null",
    "garantia_tarjeta": "string | null"
   },
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion": "string"
  }
 },
 {
  "label": "Apertura",
  "summary": "Comprobar si el negocio está abierto ahora, con horario oficial, festivos y margen de una hora.",
  "input": {
   "url_negocio": "URL del negocio",
   "telefono_cancelacion": "número | null"
  },
  "instructions": "Comprueba si el negocio está abierto ahora. No pruebes la reserva ni decidas si la vía es apta. Horario y festivo pueden salir aunque telefono_cancelacion sea null. Horario de hoy: usa la fuente oficial (web del negocio, del hotel o del centro comercial), registra la URL en fuente_horario y, si solo hay fuentes de terceros, dilo. Festivos y cierres: comprueba festivo nacional, de Canarias, de la isla y municipal, cierre semanal, vacaciones, cierre temporal o evento privado en su web, redes o ficha de Google; registra fuente_festivos. Calcula margen_hasta_cierre_min. abierto_ahora es true solo si está dentro del horario, no hay festivo ni cierre y quedan al menos 60 minutos. Es false si está cerrado o el margen es menor de 1 hora. Es indeterminado si horario o festivo no se pueden comprobar. Si falta el teléfono, anótalo en motivo_pendiente y no lo trates como cerrado. Si no está abierto, indica proxima_hora_valida en la zona del negocio. Registra telefono_cancelacion tal como llega y comprobado_en con la zona del negocio. No envíes una reserva. No inventes horarios, festivos ni contactos. No confirmes sin evidencia. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "abierto_ahora": "true | false | indeterminado",
   "horario_hoy": "texto | null",
   "fuente_horario": "URL | null",
   "festivo_o_cierre": "ninguno | descripción",
   "fuente_festivos": "URL | null",
   "margen_hasta_cierre_min": "number | null",
   "telefono_cancelacion": "número | null",
   "motivo_pendiente": "texto | null",
   "proxima_hora_valida": "ISO 8601 con la zona del negocio | null",
   "comprobado_en": "ISO 8601 con la zona horaria del negocio",
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion": "string"
  }
 },
 {
  "label": "Investigar integración",
  "summary": "Investigar una vez por proveedor qué integración oficial existe y qué condiciones tiene.",
  "input": {
   "software": "nombre del proveedor",

a.",

    "huella": "Huella exacta de los artefactos ejecutados"
   },
   "referencia_previa": "Output anterior de Verificación y vigilancia, o null"

function icon(name){return '<span class="ico" aria-hidden="true">'+(iconSvg[name]||'')+'</span>'}
function isPlainObject(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function isNested(value){return value!==null&&typeof value==='object'}
function fieldLabel(key){return String(key).replaceAll('_',' ')}
function stateClass(value){
  const v=String(value);
  if(/pendiente|no_intentada|inconclusa|parcial/.test(v)) return 'warn';
  if(/^(no_|error)|requiere_revision|cambios_solicitados/.test(v)) return 'bad';
  if(/apta$|encontrad|identificado|generada|aprobada|fiable|referencia_completa|documentada|confirmada|habilitada/.test(v)) return 'ok';
  return '';
}
function caseHeading(obj){
  const preferred=['nombre_negocio','nombre','id_proceso','software','tipo','origen','fuente'];
  const parts=[];
  preferred.forEach(key=>{
    const value=obj[key];
    if(value!==null&&value!==undefined&&typeof value!=='object'){
      const text=String(value);
      if(text&&text.length<80) parts.push(text);
    }
  });
  const estadoKey=['estado','estado_generacion','estado_revision','fiabilidad','estado_sistema'].find(key=>obj[key]!==null&&obj[key]!==undefined&&typeof obj[key]!=='object'&&String(obj[key]).length<42);
  return {title:parts[0]||'',extra:parts[1]&&parts[1]!==parts[0]?parts[1]:'',estado:estadoKey?String(obj[estadoKey]):''};
}
function renderScalar(value){
  if(value===null||value===undefined||value==='') return '<span class="nullcell">vacío</span>';
  if(typeof value==='boolean') return value?'sí':'no';
  return escapeHtml(String(value));
}
function renderMeta(obj, keys){
  if(!keys.length) return '';
  return '<dl class="meta">'+keys.map(key=>{
    const value=obj[key];
    const text=value===null||value===undefined?'':String(value);
    const wide=text.length>72||/_md$|explicacion|motivo|mapeo|observacion|justificante/.test(key);
    return '<div class="metafield'+(wide?' wide':'')+'"><dt>'+escapeHtml(fieldLabel(key))+'</dt><dd>'+renderScalar(value)+'</dd></div>';
  }).join('')+'</dl>';
}
function renderChips(values){
  return '<ul class="chips">'+values.map(item=>'<li>'+renderScalar(item)+'</li>').join('')+'</ul>';
}
function renderValue(value){
  if(value===null||value===undefined) return '<p class="empty">Vacío</p>';
  if(Array.isArray(value)){
    if(!value.length) return '<p class="empty">Ninguno</p>';
    if(value.every(item=>isPlainObject(item))) return '<div class="caselist">'+value.map((item,index)=>renderCase(item,index,true)).join('')+'</div>';
    if(value.every(item=>item===null||typeof item!=='object')) return renderChips(value);
    return value.map(item=>'<div class="nestbody">'+renderValue(item)+'</div>').join('');
  }
  if(isPlainObject(value)) return renderCase(value,0,true);
  return renderScalar(value);
}
function renderNestedSection(key, value){
  const list=Array.isArray(value);
  const count=list?value.length:(isPlainObject(value)?1:0);
  const empty=value===null||value===undefined||(list&&!value.length);
  const hint=empty?'Nada dentro de este caso':(list?(count===1?'1 elemento dentro de este caso':count+' elementos dentro de este caso'):'Dentro de este caso');
  return '<section class="nestblock"><header class="nesthead">'+icon('nested')+'<div><h4>'+escapeHtml(fieldLabel(key))+'</h4><p>'+hint+'</p></div></header><div class="nestbody">'+(empty?'<p class="empty">Ninguno</p>':renderValue(value))+'</div></section>';
}
function renderCase(obj, index, inner){
  if(!obj||typeof obj!=='object'||Array.isArray(obj)) return renderValue(obj);
  const keys=Object.keys(obj);
  const meta=keys.filter(key=>obj[key]===null||typeof obj[key]!=='object');
  const nested=keys.filter(key=>obj[key]!==null&&typeof obj[key]==='object');
  const head=caseHeading(obj);
  const badge=head.estado?'<span class="state '+stateClass(head.estado)+'">'+escapeHtml(head.estado)+'</span>':'';
  const title=head.title?'<strong>'+escapeHtml(head.title)+'</strong>':'';
  const extra=head.extra?'<span class="caselabel">'+escapeHtml(head.extra)+'</span>':'';
  const label=inner?icon('case'):icon('case')+'<span>Caso '+(index+1)+'</span>';
  return '<article class="case'+(inner?' inner':'')+'"><header class="casehead"><span class="caselabel">'+label+'</span>'+title+extra+badge+'</header>'+renderMeta(obj, meta)+nested.map(key=>renderNestedSection(key, obj[key])).join('')+'</article>';
}
function renderRecordTable(data){
  if(!Array.isArray(data)||!data.length) return '<p class="empty">Ninguno</p>';
  if(data.every(item=>isPlainObject(item))) return '<div class="caselist">'+data.map((item,index)=>renderCase(item,index,false)).join('')+'</div>';
  return renderValue(data);
}
function loadExampleRows(label, schema, rows){
  const data=rows||outputExamples[label];
  if(!data||!data.length) throw new Error('Sin ejemplos para '+label);
  const columns=Object.keys(schema);
  data.forEach((row,i)=>{
    columns.forEach(c=>{ if(!Object.prototype.hasOwnProperty.call(row,c)) throw new Error('Falta '+c+' en '+label+' fila '+i); });
    Object.keys(row).forEach(k=>{ if(!columns.includes(k)) throw new Error('Campo extra '+k+' en '+label); });
  });
  return data;
}

 content.innerHTML=heading('Estados por proceso','Resultado','El resultado cita cada bloque por su identificador. No copia los expedientes. La aptitud de la vía, la fiabilidad y la oferta se calculan por separado.')+`<section class="card"><h3>Resultado de la detección</h3><div class="result-row"><strong>Sin reserva online</strong><span>No encontrada tras una exploración suficiente → ${deteccionTexto('no_encontrada')}. No es no apto.</span></div><div class="result-row"><strong>Búsqueda inconclusa</strong><span>${deteccionTexto('pendiente')}. Un bloqueo o una web a medias no prueban ausencia.</span></div><div class="result-row"><strong>Enlaces encontrados</strong><span>${deteccionTexto('encontrada')}. Cada enlace sigue en paralelo a software, formulario, cancelación y apertura.</span></div></section><section class="card"><h3>Cómo se combina cada proceso</h3><p class="intro">Si la función o el script no están aprobados, las dos vías quedan en no intentada y la clasificación es PENDIENTE. no_apto solo cuando las dos vías son no aptas.</p><div class="tablewrap"><table><thead><tr><th>Automática</th><th>Enlace asistido</th><th>Aptitud</th></tr></thead><tbody>${cases.map(([a,b])=>`<tr><td>${estadoTexto[a]}</td><td>${estadoTexto[b]}</td><td><strong>${etiquetas[clasificarVias(a,b)]}</strong></td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>Compuerta de envío</h3><p class="intro">No es un agente. Decide si una reserva real puede salir. No cambia la aptitud de Automática ni la del Enlace asistido.</p><ul class="criteria"><li><strong>Función y script.</strong> Revisión aprobada de los dos.</li><li><strong>Cancelación.</strong> Estado encontrado y canal preferido verificado.</li><li><strong>Autorización.</strong> Permiso explícito y plan para gestionar la reserva de prueba.</li><li><strong>Apertura.</strong> abierto_ahora en true, margen de al menos una hora y teléfono que puedan atender.</li><li><strong>Sin canal.</strong> Búsqueda suficiente y canal no encontrado → motivo sin_canal_de_cancelacion. La aptitud se conserva.</li><li><strong>Cerrado.</strong> Negocio cerrado o sin margen → motivo pendiente_apertura, con proxima_hora_valida. La aptitud se conserva.</li></ul></section><section class="card"><h3>Oferta</h3><div class="tablewrap"><table><thead><tr><th>Aptitud</th><th>Fiabilidad</th><th>Compuerta</th><th>Oferta</th></tr></thead><tbody>${ofertaCasos.map(([c,f,g])=>`<tr><td>${etiquetas[c]||c}</td><td>${f.replaceAll('_',' ')}</td><td>${g}</td><td><strong>${ofertaTexto[clasificarOferta(c,f,g)]}</strong></td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>Output combinado</h3><pre>${escapeHtml(JSON.stringify(result,null,2))}</pre>${exampleSection('Output combinado', result)}<p class="intro" style="margin-top:12px">Cada bloque conserva fecha_evaluacion. fecha_validacion solo se completa en la revisión, cuando la comprobación es concluyente.</p></section><div class="notice">Una alerta abierta de formulario cambiado, script, control nuevo o fallo deja la oferta en bloqueada por revisión y devuelve el formulario cambiado a Observar. La aptitud técnica previa se conserva. ok en una ejecución solo significa que la respuesta se pudo interpretar. Ninguna reserva se comunica como confirmada sin confirmación real del sistema.</div>`;
}
const sections=[['Flujo completo',renderFlow],['Configuración',renderConfig],['Instrucciones',renderContracts],['Validar',renderValidations],['Resultado',renderResult]];
function render(){document.getElementById('nav').innerHTML='<div class="navtitle">Arquitectura</div>'+sections.map(([label],i)=>`<button type="button" class="${section===i?'active':''}" aria-current="${section===i?'page':'false'}" data-section="${i}"><span class="num">${i+1}</span>${label}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{section=Number(b.dataset.section);render();window.scrollTo({top:0,behavior:'smooth'})}));sections[section][1]()}
render();
</script>
