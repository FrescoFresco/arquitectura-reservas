<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212f;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}button{font:inherit}header{background:white;border-bottom:1px solid #e5eaf1;padding:20px clamp(16px,4vw,54px)}.brand{max-width:1180px;margin:auto;display:flex;align-items:center;gap:13px}.brandmark{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:12px;background:#eaf1ff;color:#1c63d5;font-size:22px}h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#677488;font-size:13px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1180px;margin:24px auto;gap:24px;padding:0 16px}nav,.main{background:white;border:1px solid #e7ebf2;border-radius:18px;box-shadow:0 8px 30px #24334a08}nav{padding:14px;height:max-content;position:sticky;top:16px}.navtitle{font-size:11px;color:#8490a1;letter-spacing:.09em;font-weight:800;padding:8px 12px 12px;text-transform:uppercase}nav button{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:11px;margin-bottom:5px;display:flex;align-items:center;gap:11px;cursor:pointer;color:#344156;font-size:13px}nav button.active{background:#eaf1ff;color:#165bd4;font-weight:750}.num{display:grid;place-items:center;border:1px solid #dce3ed;background:#f4f7fb;width:29px;height:29px;border-radius:9px;font-size:12px;flex:none}.active .num{background:#dbe9ff}.main{min-height:570px;padding:clamp(22px,4vw,45px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.1em;color:#4579dc}.pill{font-size:11px;background:#edf3ff;color:#315eb6;border-radius:40px;padding:8px 11px;font-weight:700}h2{font-size:28px;letter-spacing:-.035em;margin:12px 0}p.desc{font-size:15px;color:#5f6f84;line-height:1.65;max-width:750px;margin:0 0 22px}.tabs{display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid #e7ebf2;margin:25px 0 20px;padding-bottom:9px}.tabs button{flex:none;border:1px solid #dce5f2;border-radius:10px;background:#fff;color:#52657e;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer}.tabs button[aria-selected="true"]{background:#eaf1ff;border-color:#a9c5ef;color:#185aba}button:focus-visible{outline:2px solid #266bd1;outline-offset:2px}.card{border:1px solid #e7ebf1;border-radius:14px;padding:19px;margin:15px 0;background:#fff}.card h3{font-size:14px;margin:0 0 13px}.card.prompt{border-color:#bbd1f5;background:#f7faff}.prompthead{display:flex;align-items:center;justify-content:space-between;gap:10px}.prompthead h3{color:#2459a9}.copy{border:1px solid #a6c3ef;border-radius:9px;background:white;color:#2459a9;padding:8px 11px;cursor:pointer;font-weight:700;font-size:12px}pre{margin:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;border:1px solid #e6edf5;border-radius:10px;padding:15px;color:#34445b;font-size:12px;line-height:1.6}.prompttext{white-space:pre-line;color:#364b65;font-size:14px;line-height:1.8;margin:0}.intro{font-size:13px;color:#66758a;line-height:1.6;margin:0 0 8px}.notice{background:#eff5ff;color:#315784;padding:14px 16px;border-radius:11px;font-size:13px;line-height:1.6;margin-top:19px}.criteria{list-style:none;margin:0;padding:0}.criteria li{border-top:1px solid #edf0f5;padding:12px 0;font-size:13px;line-height:1.6;color:#4c5c70}.criteria li:first-child{border-top:0;padding-top:0}.criteria li:last-child{padding-bottom:0}.criteria strong{color:#27384d}.result-row{display:grid;grid-template-columns:155px 1fr;gap:12px;border-top:1px solid #edf0f5;padding:13px 0;font-size:13px;line-height:1.55}.result-row:first-of-type{border-top:0}.result-row strong{color:#315784}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid #e7ebf2;line-height:1.5}th{background:#f6f8fc;color:#64748b;font-weight:700}td strong{color:#315784}.map-panel{border:1px solid #dce5f2;border-radius:15px;background:#fbfdff;overflow:hidden}.map-panel>summary{list-style:none;display:flex;gap:12px;align-items:center;cursor:pointer;padding:17px 20px;font-size:14px;font-weight:800;color:#245bb2}.map-panel>summary::-webkit-details-marker{display:none}.map-panel .hint{display:block;color:#75859a;font-size:11px;font-weight:500;margin-top:3px}.map-body{padding:0 16px 20px}.mermaid{overflow:auto;text-align:center;min-height:110px;max-height:72vh;max-width:100%;border-radius:12px}.mermaid svg{display:block;width:100%!important;max-width:100%!important;height:auto!important;min-width:0!important;margin:auto}.map-fallback{white-space:pre-wrap;overflow:auto;max-height:360px;padding:16px;background:#f3f6fc;border-radius:10px;font-size:11px;color:#334155}.mapstatus{color:#75859a;font-size:12px;margin:10px 0 0}.mermaid .node{cursor:pointer}.mermaid .node:hover rect,.mermaid .node:hover .label-container{filter:brightness(.97)}.map-hint{font-size:12px;color:#66758a;margin:0 0 10px}@media(max-width:760px){.layout{display:block;margin:12px auto}nav{position:relative;top:0;margin-bottom:12px;display:flex;overflow-x:auto;gap:5px}nav .navtitle{display:none}nav button{min-width:132px;margin:0;padding:10px;font-size:11px}.main{min-height:520px}.result-row{grid-template-columns:1fr;gap:3px}h2{font-size:24px}}

.ico{display:inline-flex;flex:none;width:16px;height:16px;color:currentColor}.ico svg{width:16px;height:16px;display:block}

<body>
<header><div class="brand"><span class="brandmark" aria-hidden="true">▣</span><div><h1>Arquitectura de reservas web</h1><p>Ficha · Punto A · Apertura y contactos · ramas por proceso · compuerta</p></div></div></header>
<div class="layout"><nav id="nav" aria-label="Secciones"></nav><main class="main" id="content"></main></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
const contracts=[
 {
  "label": "Ficha del negocio",
  "summary": "Centralizar una vez los datos del negocio que no pertenecen a ninguna rama: nombre, zona horaria y ámbito festivo.",
  "input": {
   "url_negocio": "URL del negocio"
  },
  "instructions": "Tu propósito es crear la ficha del negocio: los datos que valen para todas las ramas y no deben repetirse después.\n\nCon url_negocio, identifica nombre_negocio, zona_horaria (IANA, por ejemplo Atlantic/Canary) y ambito_festivo (país, comunidad o región, isla o provincia, municipio) con fuentes atribuibles: web del negocio, ficha pública tipo Google Maps u otra fuente oficial. Cita cada fuente. No inventes nombre, zona ni ámbito.\n\nestado es completa si nombre, zona y ámbito quedan sostenidos; pendiente si falta alguno esencial. No busques enlaces de reserva (eso es Punto A). No armes la pila de cron (eso es Apertura). No listes teléfonos ni canales (eso es Contactos del negocio). No confirmes una reserva.\n\nRegistra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "estado": "completa | pendiente",
   "url_negocio": "URL del negocio",
   "nombre_negocio": "string | null",
   "zona_horaria": "IANA | null",
   "ambito_festivo": {
      "pais": "string | null",
      "comunidad_o_region": "string | null",
      "isla_o_provincia": "string | null",
      "municipio": "string | null"
   },
   "evidencias": [
      {
         "origen": "URL o ficha",
         "fragmento": "string",
         "explicacion_md": "Markdown: cómo este fragmento sostiene el hecho citado"
      }
   ],
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion_md": "Markdown completo que explica el resultado de este bloque"
},
  "review": {
   "intro": "Aprueba o rechaza el output que este bloque acaba de producir. No investiga el negocio otra vez.",
   "input": "Output del bloque",
   "checks": [],
   "outcome": "aprobada | cambios_solicitados | inconclusa"
  }
 },
 {
  "label": "Punto A",
  "summary": "Localizar cada enlace donde el negocio empieza una reserva. No redefine la ficha.",
  "input": {
   "url_negocio": "URL del negocio (la misma de la ficha)"
  },
  "instructions": "Tu propósito es localizar cada enlace en el que el negocio empieza una reserva. La ficha del negocio ya concentra nombre, zona y ámbito festivo: no los reescribas aquí.\n\nExplora la web y los destinos a los que conduce, incluidos widgets o servicios externos. Para cada inicio registra id_proceso, url_inicio y alcance. Separa procesos con enlace o cobertura distinta; agrupa accesos que abren el mismo inicio y explica por qué.\n\nUsa no_encontrada solo si la exploración basta para sostener que no hay reserva online. Bloqueo, web a medias o falta de evidencia es pendiente. El resultado de negocio es sin_reserva_online o pendiente, nunca no_apto.\n\nNo identifiques software, no recorras el formulario, no busques cancelación ni horario. No inventes enlaces. No confirmes una reserva. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "estado": "encontrada | no_encontrada | pendiente",
   "procesos": [
      {
         "id_proceso": "Identificador del proceso",
         "url_inicio": "URL de inicio de la reserva",
         "alcance": "Reservas que cubre"
      }
   ],
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion_md": "Markdown completo que explica el resultado de este bloque"
},
  "review": {
   "intro": "Aprueba o rechaza el output que este bloque acaba de producir. No investiga el negocio otra vez.",
   "input": "Output del bloque",
   "checks": [],
   "outcome": "aprobada | cambios_solicitados | inconclusa"
  }
 },
 {
  "label": "Apertura",
  "summary": "Una vez por negocio: Markdown versionado y pila de cron. La zona horaria sale de la ficha, no de cada cron.",
  "input": {
   "url_negocio": "URL del negocio",
   "zona_horaria": "IANA de la ficha | null",
   "ambito_festivo": "Ámbito de la ficha | null",
   "informe_previo": "informe de apertura anterior | null"
  },
  "instructions": "Tu propósito es investigar si el negocio está abierto ahora. Se ejecuta una sola vez por negocio, no por cada enlace de reserva.\n\nPrimero escribe observacion_apertura_md: web del negocio y Google Maps u otra ficha pública, con URL, hora de consulta y lo observado. Cada ejecución crea un informe nuevo (v1, v2…). timestamp es el instante de este informe en la zona de la ficha. No reescribas el Markdown anterior.\n\nDespués construye pila_cron. Cada job tiene tipo, efecto (abierto|cerrado), cron de 5 campos, fuente y nota. No incluyas zona en el job: la zona_horaria vive en la ficha del negocio y se usa al evaluar. Los cierres van después de los horarios ordinarios; entre jobs que coinciden gana el último.\n\nEvalúa la pila en timestamp con la zona de la ficha. abierto_ahora es true solo con job ganador abierto y margen ≥ 60 minutos. Si zona_horaria falta, abierto_ahora es indeterminado. No registres teléfonos (Contactos del negocio). No decidas aptitud de vía. No envíes reservas.\n\nRegistra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "version": "v1 | v2 | v3 | …",
   "timestamp": "ISO 8601; instante de este informe",
   "observacion_apertura_md": "Informe Markdown web + Maps",
   "pila_cron": [
      {
         "tipo": "horario_ordinario | cierre_semanal | festivo | vacaciones | evento_privado | horario_especial",
         "efecto": "abierto | cerrado",
         "cron": "minuto hora día-mes mes día-semana",
         "fuente": "URL o ficha",
         "nota": "string | null"
      }
   ],
   "abierto_ahora": "true | false | indeterminado",
   "margen_hasta_cierre_min": "number | null",
   "proxima_hora_valida": "ISO 8601 | null",
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion_md": "Markdown completo que explica el resultado de este bloque"
},
  "review": {
   "intro": "Aprueba o rechaza el output que este bloque acaba de producir. No investiga el negocio otra vez.",
   "input": "Output del bloque",
   "checks": [],
   "outcome": "aprobada | cambios_solicitados | inconclusa"
  }
 },
 {
  "label": "Contactos del negocio",
  "summary": "Una vez por negocio: canales de contacto publicados (teléfono, WhatsApp, email, formulario).",
  "input": {
   "url_negocio": "URL del negocio"
  },
  "instructions": "Tu propósito es reunir los canales de contacto que el negocio publica. Se ejecuta una vez por negocio.\n\nBusca en la web, la ficha pública y fuentes oficiales: teléfono, WhatsApp, email, formulario. Cada canal lleva tipo, valor, fuente, fecha_consulta y evidencia. Distingue uso publicado (contacto general, reservas, otro). No inventes contactos. WhatsApp solo si el negocio lo señala.\n\nestado es encontrado si hay al menos un canal verificable; no_encontrado si la búsqueda bastó y no hay canal; pendiente si la exploración quedó a medias. No decidas todavía el canal preferido de cancelación de un proceso (eso es Canal de cancelación). No armes horarios. No confirmes reservas.\n\nRegistra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "estado": "encontrado | no_encontrado | pendiente",
   "canales_contacto": [
      {
         "tipo": "whatsapp | telefono | email | formulario",
         "valor": "string",
         "tipo_linea": "movil | fijo | no_aplica | desconocido",
         "uso_publicado": "contacto | reservas | desconocido",
         "verificado_como_contacto": "boolean",
         "fuente": "URL",
         "fecha_consulta": "ISO 8601",
         "evidencia": "string"
      }
   ],
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion_md": "Markdown completo que explica el resultado de este bloque"
},
  "review": {
   "intro": "Aprueba o rechaza el output que este bloque acaba de producir. No investiga el negocio otra vez.",
   "input": "Output del bloque",
   "checks": [],
   "outcome": "aprobada | cambios_solicitados | inconclusa"
  }
 },
 {
  "label": "Identificar software",
  "summary": "Decir qué software usa el enlace de inicio, con un razonamiento completo en Markdown y evidencia aparte.",
  "input": {
   "id_proceso": "Identificador del proceso",
   "url_inicio": "URL de inicio de la reserva"
  },
  "instructions": "Identifica el software de este enlace de inicio. Trabaja solo con id_proceso y url_inicio; no uses el expediente de Punto A. Revisa recursos, dominios, código visible, llamadas de red, textos y comportamiento del widget. No te limites a una lista fija de proveedores.\n\nLa conclusión estructurada es corta: estado y, si aplica, software_identificado con nombre y funcion_observada. El razonamiento no va en un campo corto ni rellena huecos: escribe observaciones_md como un Markdown completo con todo lo observado y por qué atribuyes (o no) ese software. Escribe evidencias_md como otro Markdown solo de evidencia: origen, fragmento, fecha y qué sostiene. Distingue evidencia directa de indicios débiles. Un logo aislado, una mención incidental o un script ajeno no bastan. Si hay varios componentes, explica la función de cada uno en observaciones_md.\n\nUsa identificado cuando la atribución se sostiene con evidencia directa; no_identificado si la búsqueda fue suficiente y no hay proveedor atribuible; pendiente si la búsqueda quedó a medias. No investigues la integración, no definas la función y no generes script. No inventes proveedores. No evadas controles. No confirmes una reserva. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.",
  "output": {
   "id_proceso": "Identificador del proceso",
   "estado": "identificado | no_identificado | pendiente",
   "software_identificado": [
      {
         "nombre": "string",
         "funcion_observada": "string"
      }
   ],
   "observaciones_md": "Markdown completo: observaciones y por qué se identifica (o no) ese software",
   "evidencias_md": "Markdown de evidencia: origen, fragmento, fecha y qué sostiene",
   "incertidumbres": [],
   "fecha_evaluacion": "ISO 8601",
   "fecha_validacion": "ISO 8601 | null",
   "explicacion_md": "Markdown completo que explica el resultado de este bloque"
},
  "review": {
   "intro": "Aprueba o rechaza el output que este bloque acaba de producir. Comprueba que observaciones_md y evidencias_md sostienen el estado y software_identificado. No investiga el negocio otra vez.",
   "input": "Output del bloque",
   "checks": [],
   "outcome": "aprobada | cambios_solicitados | inconclusa"
  }
 },
 {
  "label": "Observar formulario",
  "summary": "Recorrer el enlace de inicio hasta justo antes de confirmar y relatar lo visto.",
  "input": {
   "id_proceso": "Identificador del proceso",

function icon(name){return '<span class="ico" aria-hidden="true">'+(iconSvg[name]||'')+'</span>'}
function isPlainObject(value){return value!==null&&typeof value==='object'&&!Array.isArray(value)}
function isNested(value){return value!==null&&typeof value==='object'}
function fieldLabel(key){return String(key).replaceAll('_',' ')}
function stateClass(value){
  const v=String(value);
  if(/pendiente|no_intentada|inconclusa|parcial/.test(v)) return 'warn';
  if(/^(no_|error)|requiere_revision|cambios_solicitados/.test(v)) return 'bad';
  if(/apta$|encontrad|identificado|generada|aprobada|fiable|referencia_completa|documentada|confirmada|habilitada/.test(v)) return 'ok';
  return '';
}
function caseHeading(obj){
  const preferred=['nombre_negocio','nombre','id_proceso','software','tipo','origen','fuente'];
  const parts=[];
  preferred.forEach(key=>{
    const value=obj[key];
    if(value!==null&&value!==undefined&&typeof value!=='object'){
      const text=String(value);
      if(text&&text.length<80) parts.push(text);
    }
  });
  const estadoKey=['estado','estado_generacion','estado_revision','fiabilidad','estado_sistema'].find(key=>obj[key]!==null&&obj[key]!==undefined&&typeof obj[key]!=='object'&&String(obj[key]).length<42);
  return {title:parts[0]||'',extra:parts[1]&&parts[1]!==parts[0]?parts[1]:'',estado:estadoKey?String(obj[estadoKey]):''};
}
function renderScalar(value){
  if(value===null||value===undefined||value==='') return '<span class="nullcell">vacío</span>';
  if(typeof value==='boolean') return value?'sí':'no';
  return escapeHtml(String(value));
}
function renderMeta(obj, keys){
  if(!keys.length) return '';
  return '<dl class="meta">'+keys.map(key=>{
    const value=obj[key];
    const text=value===null||value===undefined?'':String(value);
    const wide=text.length>72||/_md$|explicacion|motivo|mapeo|observacion|justificante/.test(key);
    return '<div class="metafield'+(wide?' wide':'')+'"><dt>'+escapeHtml(fieldLabel(key))+'</dt><dd>'+renderScalar(value)+'</dd></div>';
  }).join('')+'</dl>';
}
function renderChips(values){
  return '<ul class="chips">'+values.map(item=>'<li>'+renderScalar(item)+'</li>').join('')+'</ul>';
}
function renderValue(value){
  if(value===null||value===undefined) return '<p class="empty">Vacío</p>';
  if(Array.isArray(value)){
    if(!value.length) return '<p class="empty">Ninguno</p>';
    if(value.every(item=>isPlainObject(item))) return '<div class="caselist">'+value.map((item,index)=>renderCase(item,index,true)).join('')+'</div>';
    if(value.every(item=>item===null||typeof item!=='object')) return renderChips(value);
    return value.map(item=>'<div class="nestbody">'+renderValue(item)+'</div>').join('');
  }
  if(isPlainObject(value)) return renderCase(value,0,true);
  return renderScalar(value);
}
function renderNestedSection(key, value){
  const list=Array.isArray(value);
  const count=list?value.length:(isPlainObject(value)?1:0);
  const empty=value===null||value===undefined||(list&&!value.length);
  const hint=empty?'Nada dentro de este caso':(list?(count===1?'1 elemento dentro de este caso':count+' elementos dentro de este caso'):'Dentro de este caso');
  return '<section class="nestblock"><header class="nesthead">'+icon('nested')+'<div><h4>'+escapeHtml(fieldLabel(key))+'</h4><p>'+hint+'</p></div></header><div class="nestbody">'+(empty?'<p class="empty">Ninguno</p>':renderValue(value))+'</div></section>';
}
function renderCase(obj, index, inner){
  if(!obj||typeof obj!=='object'||Array.isArray(obj)) return renderValue(obj);
  const keys=Object.keys(obj);
  const meta=keys.filter(key=>obj[key]===null||typeof obj[key]!=='object');
  const nested=keys.filter(key=>obj[key]!==null&&typeof obj[key]==='object');
  const head=caseHeading(obj);
  const badge=head.estado?'<span class="state '+stateClass(head.estado)+'">'+escapeHtml(head.estado)+'</span>':'';
  const title=head.title?'<strong>'+escapeHtml(head.title)+'</strong>':'';
  const extra=head.extra?'<span class="caselabel">'+escapeHtml(head.extra)+'</span>':'';
  const label=inner?icon('case'):icon('case')+'<span>Caso '+(index+1)+'</span>';
  return '<article class="case'+(inner?' inner':'')+'"><header class="casehead"><span class="caselabel">'+label+'</span>'+title+extra+badge+'</header>'+renderMeta(obj, meta)+nested.map(key=>renderNestedSection(key, obj[key])).join('')+'</article>';
}
function renderRecordTable(data){
  if(!Array.isArray(data)||!data.length) return '<p class="empty">Ninguno</p>';
  if(data.every(item=>isPlainObject(item))) return '<div class="caselist">'+data.map((item,index)=>renderCase(item,index,false)).join('')+'</div>';
  return renderValue(data);
}
function loadExampleRows(label, schema, rows){
  const data=rows||outputExamples[label];
  if(!data||!data.length) throw new Error('Sin ejemplos para '+label);
  const columns=Object.keys(schema);
  data.forEach((row,i)=>{
    columns.forEach(c=>{ if(!Object.prototype.hasOwnProperty.call(row,c)) throw new Error('Falta '+c+' en '+label+' fila '+i); });
    Object.keys(row).forEach(k=>{ if(!columns.includes(k)) throw new Error('Campo extra '+k+' en '+label); });
  });
  return data;
}

function ensureActiveBlockTabVisible(){
  const row=content.querySelector('.tabs');
  const active=content.querySelector('.tabs button[aria-selected="true"]');
  if(!row||!active) return;
  const pad=12;
  const rowRect=row.getBoundingClientRect();
  const tabRect=active.getBoundingClientRect();
  const left=tabRect.left-rowRect.left+row.scrollLeft;
  const right=left+tabRect.width;
  const viewLeft=row.scrollLeft;
  const viewRight=viewLeft+row.clientWidth;
  if(left<viewLeft+pad) row.scrollLeft=Math.max(0,left-pad);
  else if(right>viewRight-pad) row.scrollLeft=Math.min(row.scrollWidth-row.clientWidth,right-row.clientWidth+pad);
}

  const summary=`<p class="intro contract-summary">${escapeHtml(d.summary)}</p>`;
  const viewswitch=`<div class="viewswitch three" role="tablist" aria-label="Vista del bloque"><button type="button" role="tab" aria-selected="${contractView===0}" data-view="0"><span class="switch-title">${icon('definition')} Contrato</span><span class="switch-sub">Input, instrucciones, output</span></button><button type="button" role="tab" aria-selected="${contractView===1}" data-view="1"><span class="switch-title">${icon('instructions')} Revisión</span><span class="switch-sub">Veredicto sobre este output</span></button><button type="button" role="tab" aria-selected="${contractView===2}" data-view="2"><span class="switch-title">${icon('examples')} Ejemplos</span><span class="switch-sub">Casos de entrada y salida</span></button></div>`;
  const contrato=`<div id="panel-vista" role="tabpanel"><section class="card"><h3 class="h-ico">${icon('input')} Input</h3><pre>${escapeHtml(JSON.stringify(d.input,null,2))}</pre></section><section class="card prompt"><div class="prompthead"><h3 class="h-ico">${icon('instructions')} Instrucciones</h3><button class="copy" type="button" id="copyPrompt">Copiar</button></div><p class="prompttext">${escapeHtml(d.instructions)}</p></section><section class="card"><h3 class="h-ico">${icon('output')} Output</h3><pre>${escapeHtml(JSON.stringify(d.output,null,2))}</pre></section></div>`;
  const revision=`<div id="panel-vista" role="tabpanel"><p class="intro">${escapeHtml(d.review.intro)}</p><section class="card"><h3>Veredicto</h3><pre>${escapeHtml(JSON.stringify(validationOutput,null,2))}</pre></section>${exampleSection('Output de la revisión', validationOutput)}</div>`;
  const exampleRows=contractExample===0?inputExamples[d.label]:outputExamples[d.label];
  const exampleSchema=contractExample===0?d.input:d.output;
  const exampleHint=contractExample===0?'Cada tarjeta es un caso de entrada.':'Cada tarjeta es un caso de salida.';
  const examples=`<div id="panel-vista" role="tabpanel"><div class="sidetabs" role="tablist" aria-label="Lado del ejemplo"><button type="button" role="tab" aria-selected="${contractExample===0}" data-side="0">${icon('input')} Input</button><button type="button" role="tab" aria-selected="${contractExample===1}" data-side="1">${icon('output')} Output</button></div><p class="intro">${exampleHint}</p><section class="card">${renderRecordTable(loadExampleRows(d.label, exampleSchema, exampleRows))}</section></div>`;
  const panel=contractView===0?contrato:(contractView===1?revision:examples);
  content.innerHTML=heading('Piezas del sistema','Operaciones','Cada bloque tiene contrato, revisión (aprobar o rechazar ese output) y ejemplos. Verificación y vigilancia compara una ejecución con una referencia.','14 bloques')+tabs(contracts,contractTab,'contratos')+`<div id="panel-contratos">${summary}${viewswitch}${panel}</div>`;
  bindTabs('contratos',i=>{contractTab=i;renderOperaciones({preserveScroll:true})});
  content.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{contractView=Number(b.dataset.view);renderOperaciones({preserveScroll:true})}));
  content.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{contractExample=Number(b.dataset.side);contractView=2;renderOperaciones({preserveScroll:true})}));
  const copy=document.getElementById('copyPrompt');
  if(copy) copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.instructions);copy.textContent='Copiado'}catch(e){const t=document.createElement('textarea');t.value=d.instructions;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();copy.textContent='Copiado'}};
  if(preserveScroll) restoreOpsScroll(pageY);
  else requestAnimationFrame(ensureActiveBlockTabVisible);
}
function clasificarDeteccion(estado){
 if(estado==='encontrada')return 'procesos_identificados';
 if(estado==='no_encontrada')return 'sin_reserva_online';
 if(estado==='pendiente')return 'pendiente';
 throw new Error('Estado de detección no reconocido');
}
function clasificarVias(automatica,asistida){
 const estados=['apta','no_apta','pendiente','no_intentada'];
 if(!estados.includes(automatica)||!estados.includes(asistida))throw new Error('Estado de vía no reconocido');
 if(automatica==='apta')return 'apto_automatico';
 if(asistida==='apta')return 'apto_asistido';
 if(automatica==='no_apta'&&asistida==='no_apta')return 'no_apto';
 return 'pendiente';
}
function clasificarOferta(clasificacion, fiabilidad, compuerta){
 if(fiabilidad==='requiere_revision')return 'bloqueada_por_alerta';
 if((clasificacion==='apto_automatico'||clasificacion==='apto_asistido')&&fiabilidad==='fiable'&&compuerta==='abierta')return 'habilitada';
 return 'pendiente';
}
const sections=[['Mapa',renderMapa],['Operaciones',renderOperaciones]];
function render(){document.getElementById('nav').innerHTML='<div class="navtitle">Arquitectura</div>'+sections.map(([label],i)=>`<button type="button" class="${section===i?'active':''}" aria-current="${section===i?'page':'false'}" data-section="${i}"><span class="num">${i+1}</span>${label}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{section=Number(b.dataset.section);render();window.scrollTo({top:0,behavior:'smooth'})}));sections[section][1]()}
render();
</script>
