const contracts=[
 {label:'Detectar procesos',summary:'Encontrar los procesos de reserva online y confirmar qué reservas cubre cada uno.',input:{url_negocio:'URL del negocio'},instructions:`Tu propósito es localizar cada proceso de reserva online que el propio negocio ofrece.

Explora la web de forma razonada. Sigue las opciones que puedan iniciar una reserva, incluidas páginas, widgets o servicios externos a los que el negocio conduzca. Usa lo que observes para decidir qué comprobar después y revisa tus conclusiones si la evidencia cambia.

Comprueba que cada recorrido inicia una reserva del negocio y define su alcance. Separa procesos con recorridos o coberturas distintas; agrupa accesos que conducen al mismo proceso y explica por qué. Conserva URL, recorrido observado y evidencia.

Usa no_encontrada solo si la exploración permite sostener que no se ofrece reserva online. Si no puedes concluir por falta de acceso, datos o evidencia, usa pendiente. No confundas no haber encontrado un enlace con haber confirmado que no existe. Registra fecha_evaluacion y deja fecha_validacion vacía hasta que la revisión independiente sea concluyente.`,output:{estado:'encontrada | no_encontrada | pendiente',nombre_negocio:'string | null',procesos:[{id_proceso:'Identificador del proceso',alcance:'Reservas que cubre',url_reservas:'URL verificada',recorrido_observado:[],evidencias:[]}],incertidumbres:[],fecha_evaluacion:'ISO 8601',fecha_validacion:'ISO 8601 | null',explicacion:'string'}},
 {label:'Identificar software',summary:'Determinar qué software interviene en un proceso y justificarlo con evidencia directa.',input:{resultado_detectar:'Output revisado de Detectar',proceso:'Un proceso concreto del output anterior'},instructions:`Tu propósito es identificar el software que interviene en el proceso de reserva recibido y explicar la evidencia que sustenta la identificación.

Investiga las señales disponibles en el propio recorrido: por ejemplo, recursos cargados, dominios, código visible, llamadas de red, textos o comportamiento del widget. Elige las comprobaciones según lo observado; no te limites a una lista fija de proveedores.

Para cada software atribuido, registra el origen exacto, el fragmento o señal observada y por qué conecta ese software con este proceso. Distingue evidencia directa de indicios débiles. Una referencia incidental, un logo aislado o un script no relacionado no bastan para atribuir el sistema de reservas. Si intervienen varios componentes, explica la función observada de cada uno.

Si no puedes atribuir el software con confianza, conserva las señales e incertidumbres y usa no_identificado o pendiente según si la investigación quedó suficientemente revisada. Registra fecha_evaluacion y deja fecha_validacion vacía hasta la revisión independiente.`,output:{id_proceso:'Identificador del proceso',estado:'identificado | no_identificado | pendiente',software_identificado:[{nombre:'string',funcion_observada:'string',evidencias:[{origen:'URL o recurso',fragmento:'Señal observada',explicacion:'Cómo sustenta la atribución'}]}],incertidumbres:[],fecha_evaluacion:'ISO 8601',fecha_validacion:'ISO 8601 | null',explicacion:'string'}},
 {label:'Investigar integración',summary:'Investigar una vez por proveedor qué integración oficial existe y qué condiciones tiene.',input:{software_identificado:'Un software del output anterior',investigacion_previa:'Hallazgos reutilizables | null'},instructions:`Tu propósito es investigar qué vías oficiales ofrece este proveedor para consultar disponibilidad o gestionar reservas y bajo qué condiciones.

Revisa primero la investigación previa. Comprueba si sigue vigente y si aplica a este software y a las operaciones necesarias. Investiga documentación, API, SDK, programa de partners u otra integración oficial usando fuentes atribuibles; registra enlaces, fechas y qué afirma cada fuente. No confundas un endpoint interno observado en una web con una API pública u oficialmente autorizada.

Registra también las condiciones de uso y las señales publicadas en robots.txt que afecten a los recursos del proveedor. Anota el origen, alcance y fecha de consulta. Explica qué indican y qué no permiten concluir: robots.txt por sí solo no demuestra que exista un bloqueo técnico ni resuelve las condiciones de acceso a una API oficial. No propongas evadir controles. Si falta autorización o una condición no está clara, deja esa cuestión pendiente.

Separa los hallazgos reutilizables del proveedor de lo que se debe confirmar para cada negocio: acceso concedido, credenciales, alcance, disponibilidad y permiso operativo. No supongas que usar el proveedor da acceso automático a las reservas de sus clientes. Si no localizas una integración tras una búsqueda documentada, dilo sin afirmar que es imposible. Registra fecha_evaluacion y fecha_validacion.`,output:{software:'string',estado:'documentada | no_localizada | pendiente',integraciones_encontradas:[],operaciones_documentadas:[],condiciones_proveedor:[{tipo:'API | términos | robots.txt | otra',fuente:'URL',fecha_consulta:'ISO 8601',alcance:'string',hallazgo:'string',implicacion:'string'}],requisitos_por_negocio:[],fuentes:[],incertidumbres:[],fecha_evaluacion:'ISO 8601',fecha_validacion:'ISO 8601 | null',explicacion:'string'}},
 {label:'Función de reserva',summary:'Observar el formulario real y generar con trazabilidad la función telefónica y el script reutilizable.',input:{proceso:'Proceso revisado de Detectar',investigacion_integracion:'Output revisado de Investigar integración',acceso_al_recorrido:'URL y sesión de observación autorizada',resultado_verificacion:'Output de Verificación y vigilancia | null',artefactos_previos:'Función y script anteriores | null'},instructions:`Un solo agente realiza toda la observación y, en esa misma ejecución, genera una función de reserva reutilizable para el agente telefónico y el script que emplean Automática y Enlace asistido. Observa el recorrido real y genera sus artefactos en este orden: observacion_formulario.md, justificante_campos.md, funcion.json y script.js. No delegues la observación ni generes código antes de cerrar el justificante.

1. Observación del formulario (observacion_formulario.md)
Recorre el proceso real paso a paso, desde el inicio hasta justo antes de confirmar. Relata libremente, con fidelidad y en el orden observado, lo visible y lo que puedas comprobar de su construcción: código, peticiones de red, validaciones, dependencias entre pasos, mensajes, comportamientos inesperados y capturas pertinentes. No fuerces una plantilla ni una lista previa de atributos. Describe hechos y evidencia; no decidas qué debe pedirse, qué conviene automatizar ni cuál debería ser la función. No pulses la acción que enviaría o confirmaría una reserva.

2. Justificante de los campos de la función (justificante_campos.md)
Deriva el justificante únicamente de observacion_formulario.md. Decide qué datos debe aportar el cliente y cómo se usan en el formulario. Cada campo, obligatoriedad, formato, restricción, transformación, selector, acción, dependencia entre pasos y señal de resultado que necesiten funcion.json o script.js debe citar la sección, fragmento o captura concreta del relato que lo sustenta. Justifica también cómo la evidencia alimenta las cuatro claves de respuesta: estado, referencia, alternativas y motivo. Incluye señales observadas para reconocer disponibilidad sin hueco, error y confirmación; si una señal no consta, no la inventes y deja la generación pendiente o representa el dato como null/array vacío cuando lo permita el contrato. No añadas un campo o comportamiento que no puedas justificar. Si el relato no permite justificar una parte necesaria, no la inventes: deja la generación pendiente y explica qué evidencia falta.

3. Definición de la función (funcion.json)
Genérala solo a partir de justificante_campos.md. Los parámetros son dinámicos: contienen únicamente los datos justificados, con sus formatos, condiciones y obligatoriedad respaldados. Es la función que invoca el agente telefónico. Su respuesta conserva siempre las mismas cuatro claves y tipos: estado (confirmada | sin_hueco | error), referencia (string | null), alternativas (array de string) y motivo (string | null). Devuelve confirmada solo ante una señal verificable de confirmación; sin_hueco solo ante evidencia de que no hay disponibilidad; usa error si falla el recorrido, no se puede verificar el resultado o el negocio aún no ha aceptado la solicitud; en este último caso, explica la aceptación pendiente en motivo y no lo marques como confirmada. No confundas una respuesta interpretable del script con una reserva confirmada.

4. Script (script.js)
Genéralo únicamente a partir del justificante_campos.md. Usa Playwright y los datos dinámicos que recibe la función; no presupongas nombres de campos, orden fijo ni formulario común a todos los negocios. Valida la entrada conforme a funcion.json y aplica solo pasos, selectores, transformaciones y comprobaciones justificados. El mismo artefacto se comparte con Automática y Enlace asistido: el orquestador decide si solo prepara/rellena el recorrido o si puede enviarlo, según el propósito de la vía y sus requisitos. El script devuelve exactamente el mismo contrato de cuatro claves de funcion.json. Nunca incluyas un campo de control interno como si fuera un dato del cliente. No confirmes durante esta observación.

Si Verificación y vigilancia informa que cambió el formulario, registra la alerta formulario_cambiado, activa de nuevo este bloque antes de otra ejecución de Automática o Enlace asistido, vuelve a observarlo desde el principio y regenera los cuatro artefactos como una sola versión coherente. Hasta que el bloque y su revisión estén aprobados, Automática y Enlace asistido no ejecutan una función o script nuevo. Registra versiones o huellas para identificar exactamente qué artefactos se usaron; no incluyas credenciales en ellos.
`,output:{id_proceso:'Identificador del proceso',estado_generacion:'generada | pendiente | error',observacion_formulario_md:'Informe Markdown narrativo de hechos observados; sin decisiones ni plantilla de atributos',justificante_campos_md:'Markdown con cada dato y decisión de ejecución enlazados a evidencia del relato',funcion_json:{name:'reservar',description:'string justificado',parameters:'JSON Schema generado solo desde justificante_campos.md',response_schema:{type:'object',additionalProperties:false,required:['estado','referencia','alternativas','motivo'],properties:{estado:{enum:['confirmada','sin_hueco','error']},referencia:{type:['string','null']},alternativas:{type:'array',items:{type:'string'}},motivo:{type:['string','null']}}}},script_js:{contenido:'JavaScript Playwright generado solo desde justificante_campos.md',version:'string',huella:'string',referencia_codigo:'string'},evidencias:[],fecha_evaluacion:'ISO 8601',fecha_validacion:'ISO 8601 | null',explicacion:'string'}},
 {label:'Canal de cancelación',summary:'Investigar por proceso cómo se cancelaría una reserva real y qué canal verificable ofrece el negocio.',input:{proceso:'Proceso revisado de Detectar',resultado_identificacion:'Output de Identificar software',investigacion_integracion:'Output del proveedor | null'},instructions:`Tu propósito es averiguar cómo se podría cancelar una reserva de este proceso y qué canal verificable permitiría gestionarla.

Investiga primero las opciones que ofrece el propio sistema: instrucciones o enlaces de cancelación, gestión desde la confirmación o el área de reservas, o una operación de la integración oficial. Después busca los canales de contacto publicados por el negocio en sus fuentes oficiales o en una ficha pública que controle. Puedes seguir las señales observadas para decidir dónde comprobarlo.

Registra cada canal con su valor, fuente exacta, fecha y evidencia. Distingue un teléfono fijo de uno móvil solo si la fuente o una clasificación fiable lo sustenta. Marca WhatsApp únicamente cuando el negocio lo identifica como tal; que exista un número no demuestra que use WhatsApp. Diferencia una cancelación directa de una solicitud dirigida al negocio. Un canal oficial de contacto puede servir como vía para solicitarla, pero no demuestra que la petición se haya recibido o ejecutado. Documenta las fuentes y opciones revisadas en busqueda_realizada.

Recoge la política de cancelación relevante: plazo, coste, penalización o garantía de tarjeta cuando se publique. Elige el canal preferido entre las opciones cuya utilidad para solicitar o ejecutar la cancelación esté respaldada. Prioriza el mecanismo del sistema, después un canal escrito y finalmente una llamada, si las pruebas sostienen ese orden. Usa encontrado si se verifica al menos una vía útil; no_encontrado si se revisaron de forma suficiente las fuentes y opciones razonables y no se halló ninguna vía verificable; pendiente si la búsqueda quedó incompleta o la evidencia no permite concluir. No_encontrado describe el resultado de una búsqueda documentada, no una prueba absoluta de inexistencia. No inventes contactos ni des por cancelada una reserva.

Este resultado es un requisito previo para confirmar una reserva real de prueba: debe haber un canal preferido verificado y la política debe permitir planificar su gestión. Registra fecha_evaluacion y deja fecha_validacion vacía hasta revisión independiente.`,output:{id_proceso:'Identificador del proceso',estado:'encontrado | no_encontrado | pendiente',busqueda_realizada:{fuentes_consultadas:[],opciones_revisadas:[],limitaciones:[]},cancelacion_sistema:{disponible:'si | no | desconocido',metodo:'string | null',url_o_instrucciones:'string | null',evidencias:[{fuente:'URL o recurso',fecha_consulta:'ISO 8601',fragmento:'string'}]},canales_contacto:[{tipo:'whatsapp | telefono | email | formulario',valor:'string',tipo_linea:'movil | fijo | no_aplica | desconocido',uso_publicado:'contacto | cancelaciones | desconocido',verificado_como_contacto:'boolean',uso_cancelacion:'cancelacion_directa | solicitar_al_negocio | no_verificado',fuente:'URL',fecha_consulta:'ISO 8601',evidencia:'string'}],canal_preferido:{tipo:'string | null',valor:'string | null',metodo:'string | null',motivo:'string | null'} ,politica_cancelacion:{resumen:'string | null',plazo:'string | null',coste_o_penalizacion:'string | null',garantia_tarjeta:'string | null'} ,incertidumbres:[],fecha_evaluacion:'ISO 8601',fecha_validacion:'ISO 8601 | null',explicacion:'string'}},
 {label:'Automática',summary:'Intentar consultar disponibilidad y completar una reserva con el método que permitan las pruebas.',input:{proceso:'Proceso revisado de Detectar',resultado_identificacion:'Output de Identificar software',investigacion_integracion:'Output reutilizable del proveedor | null',resultado_canal_cancelacion:'Output revisado de Canal de cancelación',identidad_prueba:'Configuración protegida de identidad de prueba',accesos_disponibles:{},responsable_evaluacion:'Operador que inició el flujo',funcion_reserva:'Output aprobado de Función de reserva',script_reserva:'script.js versionado del mismo output',datos_reserva_prueba:'Objeto dinámico que cumple el esquema de funcion.json',autorizacion_para_confirmar_prueba:false,gestion_reserva_prueba:null},instructions:`Tu propósito es conseguir un método reutilizable para consultar disponibilidad y completar una reserva en este proceso.

Usa únicamente la función y el script aprobados del bloque Función de reserva. Pasa los datos dinámicos conforme a funcion.json y conserva la versión/huella ejecutada. No construyas campos propios ni rellenes datos no justificados. La identidad de prueba solo se mapea a parámetros presentes en el esquema; si no puede cubrir un parámetro requerido, solicita el dato al responsable y deja la vía pendiente. Sin artefactos aprobados o ante una alerta de formulario cambiado, no ejecutes el script anterior: mantén la vía pendiente hasta regenerar y revisar el bloque.

Usa la evidencia disponible para elegir un camino razonable. Si existe una integración oficial aplicable y se dispone del acceso necesario, comprueba si cubre las operaciones requeridas. Si no, evalúa otros métodos que permitan las condiciones y el comportamiento observado. La falta de una API localizada o de acceso no demuestra por sí sola que el proceso sea técnicamente imposible.

Define un contrato estructurado y estable para cada ejecución. Distingue si el script pudo ejecutarse e interpretar una respuesta de si el sistema confirmó la reserva: ok indica que la ejecución obtuvo una respuesta observable e interpretable, no que la reserva se haya confirmado. estado_sistema refleja lo que la evidencia permite afirmar y se conserva como prueba de lo que mostró el sistema. En cada ejecución añade respuesta_funcion con exactamente lo que devolvió la función: estado (confirmada | sin_hueco | error), referencia, alternativas y motivo. El mapeo a estado es: Si la disponibilidad devuelta no incluye lo pedido, disponibilidad_devuelta equivale a sin_hueco, con alternativas. Si hay hueco, es solo un paso intermedio y no un resultado final. Si la ejecución termina con un hueco disponible pero sin reserva (recorrido seguro o vigilancia), respuesta_funcion es null y estado_sistema es disponibilidad_devuelta. confirmada → confirmada; «No hay hueco para lo pedido» → sin_hueco, con alternativas si las hay; pendiente_negocio, rechazada, error, no_enviada e indeterminado → error, con un motivo que diga cuál fue. La operación de la ejecución es la de la función generada en Función de reserva, no un nombre fijo. No infieras una respuesta del servidor o un email si no se capturaron.

Registra la operación de la función generada en Función de reserva, fecha, respuesta_funcion, estado_sistema, motivo, referencia y evidencias disponibles. La respuesta del servidor puede incluir su estado HTTP y campos relevantes solo si el mecanismo los expone legítimamente. No guardes cuerpos completos, credenciales, tokens, datos de pago ni datos personales innecesarios. Resume el email recibido mediante metadatos útiles (asunto, hora y referencia) y protege su contenido. Solo espera un email si el proceso lo indica; no trates su ausencia como fallo si no era una señal esperada. Conserva capturas sin datos sensibles siempre que sea posible.

Identifica en cada ejecución la versión exacta del script y una referencia inmutable al código (por ejemplo, commit o artefacto versionado); conserva el código en el repositorio sin credenciales. Construye una referencia completa solo a partir de una reserva de prueba que el sistema haya confirmado de forma verificable y que tenga revisión aprobada. Una respuesta pendiente de aceptación del negocio no es una reserva confirmada. Si no se llegó a confirmar una reserva, puedes registrar una referencia parcial del recorrido seguro, indicando qué señales y pasos faltan; si no hay evidencia suficiente, deja la referencia pendiente. Separa las señales estables de los valores que varían entre ejecuciones, como fecha, hora o referencia.

Compara cada ejecución con una referencia aplicable. Distingue cambios menores, cambios que requieren revisar el script, modificaciones del formulario, controles nuevos y fallos del proceso. Si cambian campos, pasos, validaciones o señales del formulario, registra tipo=formulario_cambiado y accion_requerida=regenerar_funcion_reserva; no permitas otra ejecución automática/asistida con la versión anterior. Registra diferencia, evidencia, efecto en la fiabilidad y si la alerta sigue abierta. No intentes evadir CAPTCHA, login, tarjeta, antibot u otro control nuevo. Una alerta abierta de formulario_cambiado, revisar_script, control_nuevo o fallo_proceso bloquea marcar la vía como fiable u ofrecerla hasta regenerar/revisar lo necesario y cerrar la alerta; conserva aparte la aptitud técnica previamente demostrada.

La vigilancia periódica solo puede usar consultas de disponibilidad o recorridos que no creen reservas y que respeten las condiciones del proveedor. Propón una frecuencia según límites y condiciones observadas, sin inventar una frecuencia universal. Marca vigilancia activa solo si existe un mecanismo periódico realmente configurado y verificado; una frecuencia propuesta por sí sola no la activa. Nunca crees nuevas reservas en vigilancia sin autorización explícita y sin cumplir los requisitos de cancelación.

 {label:'Automática',intro:'Revisar el método elegido, la identidad usada y la gestión segura de una reserva de prueba.',input:'Proceso, outputs de software, integración, función y script aprobados, identidad protegida, accesos, argumentos dinámicos, evidencias, autorización y plan de gestión.',checks:[['Función y script','La revisión de Función de reserva está aprobada y las versiones ejecutadas coinciden con esos artefactos.'],['Alcance','El método y las pruebas corresponden al id_proceso y al alcance detectado.'],['Método','El método es aplicable y respeta las condiciones registradas; no se exige una tecnología concreta.'],['Identidad','Se usan los datos configurados, completos y reales; no se inventan ni aparecen en la documentación pública o en enlaces expuestos.'],['Contrato dinámico','Los argumentos coinciden con funcion.json, todos se justifican con el relato y la identidad de prueba solo alimenta campos respaldados.'],['Disponibilidad','La consulta ejecutada coincide con la respuesta del proceso real.'],['Creación','La prueba llega a una confirmación real solo si el canal de cancelación está aprobado, hay autorización explícita y existe un plan de gestión viable.'],['Reserva de prueba solo con el negocio abierto','La reserva cuenta como válida solo si abierto_ahora es true y cada fuente está citada. La regla aplica a cualquier reserva real que se envíe, desde Automática o desde Enlace asistido.'],['Gestión','Se registran referencia, estado de la reserva y cancelación, fechas, canal, respuesta y evidencia; solicitada no significa cancelada.'],['Clasificación','Error corregible se repara; falta de acceso, permiso, identidad o canal de cancelación no se presenta como imposibilidad técnica.'],['Fechas','Registrar evaluación y revisión independiente.']],outcome:'Apta con operaciones verificadas y requisitos de prueba cumplidos; no apta con impedimento demostrado; pendiente si falta prueba, identidad, permiso o canal de cancelación; no intentada si no se investigó.'},
 {label:'Enlace asistido',intro:'Revisar que el enlace se pueda usar en una sesión independiente y deje al cliente solo la acción final.',input:'Proceso, función y script aprobados, identidad protegida, argumentos dinámicos, hallazgos previos, canal de cancelación, enlace preparado y evidencias.',checks:[['Sesión independiente','El enlace funciona sin depender de cookies o estado previo.'],['Datos de prueba','La identidad se usa solo para la evaluación y no se presenta como la identidad del cliente final.'],['Contrato dinámico','El enlace usa la función y el script aprobados, con argumentos derivados del justificante y sin campos predefinidos añadidos.'],['Datos','Conserva los datos necesarios para ese proceso concreto.'],['Acción final','Queda claro qué debe confirmar o pagar el cliente.'],['Cancelación','Si la prueba requiere confirmar una reserva real, exige estado encontrado aprobado, canal verificado, autorización explícita y plan de gestión viable; si no, se detiene antes de confirmar.'],['Reserva de prueba solo con el negocio abierto','La reserva cuenta como válida solo si abierto_ahora es true y cada fuente está citada. La regla aplica a cualquier reserva real que se envíe, desde Automática o desde Enlace asistido.'],['Seguridad','No expone datos personales sensibles en parámetros públicos.'],['Clasificación','Errores corregibles se distinguen de impedimentos, datos o permisos pendientes.'],['Fechas','Registrar evaluación y revisión independiente.']],outcome:'Apta si el enlace cumple la prueba; no apta solo ante impedimento demostrado; pendiente si falta evidencia o un requisito para confirmar la prueba; no intentada si aún no se investigó.'},
 {label:'Verificación y vigilancia',intro:'Comprobar que la referencia es evidencia real y que las alertas reflejan cambios relevantes.',input:'Output completo de Verificación y vigilancia, función y script usados, resultado de reserva y referencia previa si existe.',checks:[['Interpretación de ok','ok indica que el script obtuvo una respuesta interpretable; nunca equivale por sí solo a reserva confirmada.'],['Estado del sistema','confirmada, pendiente_negocio, rechazada y error se derivan de señales observadas; no se infieren servidor o email inaccesibles.'],['Referencia completa','Solo procede de una reserva de prueba confirmada con evidencia y revisión aprobada; una respuesta pendiente del negocio no basta.'],['Referencia parcial','El recorrido incompleto identifica los pasos alcanzados y las señales que faltan; no se presenta como prueba de creación.'],['Comparación','Se separan los campos variables de las señales estables para evitar alertas falsas.'],['Privacidad','Evidencias y respuestas excluyen credenciales, tokens, datos de pago y datos personales innecesarios.'],['Alertas','Cada diferencia tiene categoría, evidencia, estado abierto/resuelto y efecto sobre fiabilidad; formulario_cambiado produce accion_requerida=regenerar_funcion_reserva.'],['Control nuevo','CAPTCHA, login, tarjeta, antibot u otro control no se evade; se registra y bloquea la fiabilidad hasta revisión.'],['Vigilancia segura','La operación periódica no crea reservas, respeta condiciones del proveedor y solo aparece activa si se verificó un mecanismo periódico real.'],['Resultado combinado','Alertas abiertas de formulario_cambiado, revisar_script, control_nuevo o fallo_proceso bloquean ofrecer la vía como fiable, sin borrar la aptitud técnica registrada; formulario_cambiado vuelve a ejecutar Función de reserva.'],['Fechas','Captura, ejecuciones y validación independiente están fechadas.']],outcome:'Referencia completa solo con reserva confirmada y evidencia revisada; parcial para un recorrido seguro; pendiente sin datos suficientes. La vigilancia propuesta no se declara activa sin un mecanismo periódico de ejecución verificado.'}

const content=document.getElementById('content');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isNested(value){return value!==null&&typeof value==='object'}
function simpleCell(value){
  if(value===null||value===undefined) return '<span class="nullcell">null</span>';
  if(typeof value==='object') return renderNested(value);
  return escapeHtml(String(value));
}
function nestedTabs(row, cols){
  if(!cols.length) return '';
  const buttons=cols.map((c,i)=>'<button type="button" data-example-tab="'+i+'" aria-selected="'+(i===0?'true':'false')+'">'+escapeHtml(c)+'</button>').join('');
  const panels=cols.map((c,i)=>'<div class="example-panel" data-example-panel="'+i+'"'+(i===0?'':' hidden')+'>'+renderNested(row?row[c]:null)+'</div>').join('');
  return '<div class="example-nest"><div class="example-tabs" role="tablist">'+buttons+'</div>'+panels+'</div>';
}
function renderRecordTable(data){
  const columns=[];
  data.forEach(row=>{ if(!row||typeof row!=='object'||Array.isArray(row)) return; Object.keys(row).forEach(k=>{ if(!columns.includes(k)) columns.push(k); }); });
  if(!columns.length) return '<span class="nullcell">sin campos</span>';
  const nestedCols=columns.filter(c=>data.some(row=>row&&isNested(row[c])));
  const simpleCols=columns.filter(c=>!nestedCols.includes(c));
  if(!simpleCols.length) return data.map(row=>nestedTabs(row, nestedCols)).join('');
  const head=simpleCols.map(c=>'<th>'+escapeHtml(c)+'</th>').join('');
  const body=data.map(row=>{
    const cells=simpleCols.map(c=>'<td>'+simpleCell(row?row[c]:null)+'</td>').join('');
    const sub=nestedCols.length?'<tr class="example-subrow"><td colspan="'+simpleCols.length+'">'+nestedTabs(row, nestedCols)+'</td></tr>':'';
    return '<tr>'+cells+'</tr>'+sub;
  }).join('');
  return '<div class="tablewrap"><table class="example-table"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function renderNested(value){
  if(value===null||value===undefined) return '<span class="nullcell">null</span>';
  if(Array.isArray(value)){
    if(!value.length) return '<span class="nullcell">sin registros</span>';
    if(value.every(item=>item&&typeof item==='object'&&!Array.isArray(item))) return renderRecordTable(value);
    if(value.every(item=>item===null||typeof item!=='object')) return '<div class="tablewrap"><table class="example-table"><tbody>'+value.map(item=>'<tr><td>'+simpleCell(item)+'</td></tr>').join('')+'</tbody></table></div>';
    return value.map(item=>'<div class="example-nest">'+renderNested(item)+'</div>').join('');
  }
  if(typeof value==='object') return renderRecordTable([value]);
  return escapeHtml(String(value));
}
function loadExampleRows(label, schema, rows){
  const data=rows||outputExamples[label];
  if(!data||!data.length) throw new Error('Sin ejemplos para '+label);
  const columns=Object.keys(schema);
  data.forEach((row,i)=>{
    columns.forEach(c=>{ if(!Object.prototype.hasOwnProperty.call(row,c)) throw new Error('Falta '+c+' en '+label+' fila '+i); });
    Object.keys(row).forEach(k=>{ if(!columns.includes(k)) throw new Error('Campo extra '+k+' en '+label); });
  });
  return data;
}
function exampleSection(label, schema, rows){
  return '<section class="card"><h3>Ejemplo en base de datos</h3><p class="intro">Cada fila conserva los campos simples. Cada campo anidado abre una subpestaña dentro de esa fila; si dentro hay otra anidación, esa pestaña tiene las suyas.</p>'+renderRecordTable(loadExampleRows(label, schema, rows))+'</section>';
}
if(!content.dataset.exampleTabs){
  content.dataset.exampleTabs='1';
  content.addEventListener('click',event=>{
    const btn=event.target.closest('[data-example-tab]');
    if(!btn) return;
    const nest=btn.closest('.example-nest');
    if(!nest) return;
    const id=btn.getAttribute('data-example-tab');
    nest.querySelectorAll(':scope > .example-tabs [data-example-tab]').forEach(b=>b.setAttribute('aria-selected', b===btn?'true':'false'));
    nest.querySelectorAll(':scope > [data-example-panel]').forEach(p=>{p.hidden=p.getAttribute('data-example-panel')!==id;});
  });
}

let section=0,contractTab=0,contractView=0,contractExample=0,validationTab=0;
function heading(eyebrow,title,desc,pill=''){return `<div class="top"><span class="eyebrow">${eyebrow}</span>${pill?`<span class="pill">${pill}</span>`:''}</div><h2>${title}</h2><p class="desc">${desc}</p>`}
function tabs(items,selected,name){return `<div class="tabs" role="tablist" aria-label="${name}">${items.map((item,i)=>`<button type="button" role="tab" id="${name}-${i}" aria-controls="panel-${name}" aria-selected="${i===selected}" data-tab="${i}">${escapeHtml(item.label)}</button>`).join('')}</div>`}
function bindTabs(name,callback){content.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>callback(Number(b.dataset.tab))))}
function renderConfig(){content.innerHTML=heading('Datos de ejecución','Configuración','La identidad de prueba es una configuración fija que reciben Automática y Enlace asistido; no es un agente ni una investigación.','Identidad')+`<p class="intro">${escapeHtml(identidadGuidance)}</p><section class="card"><h3>Input de configuración</h3><pre>${escapeHtml(JSON.stringify(identidadConfig,null,2))}</pre></section>${exampleSection('Input de configuración',identidadConfig,inputExamples['Input de configuración'])}<section class="card"><h3>Condiciones de uso</h3><ul class="criteria"><li><strong>Completitud.</strong> Solo son obligatorios los datos de configuración que correspondan a parámetros requeridos por funcion.json; si falta uno de ellos, no se confirma la prueba y queda pendiente.</li><li><strong>Reserva de prueba.</strong> Se usa únicamente con autorización explícita y para completar los parámetros que pida funcion.json, respetando las restricciones observadas para este proceso.</li><li><strong>Cancelación.</strong> Tras crear una reserva de prueba, registra la solicitud y el resultado real de la cancelación; conserva evidencia de la confirmación.</li><li><strong>Privacidad.</strong> Los valores se suministran de forma protegida al ejecutar los agentes; aquí solo se publica el esquema.</li><li><strong>Enlace del cliente.</strong> La identidad de prueba nunca se reutiliza como identidad del cliente que vaya a reservar.</li></ul></section><div class="notice">Antes de confirmar una prueba real, también debe estar aprobado el Canal de cancelación y existir un plan viable para gestionar la reserva.</div>`}
function renderFlow(){content.innerHTML=heading('Vista general','Flujo completo','La identidad de prueba se configura una vez. Por proceso: detectar, identificar software, investigar integración, observar y generar la función, revisar cancelación, probar ambas vías y verificar resultados.','Mapa lógico')+`<details class="map-panel" open><summary>🗺️ <span>Mapa del sistema<span class="hint">Pulsa para contraer o expandir</span></span></summary><div class="map-body"><div class="mermaid" id="flowMermaid"></div><p class="mapstatus" id="mapStatus">Cargando diagrama…</p></div></details><div class="notice">La automática puede avanzar con comprobaciones que no creen reservas, pero una confirmación real de prueba exige canal de cancelación revisado, canal preferido verificado, autorización explícita y plan de gestión. La vigilancia solo consulta disponibilidad o recorre pasos seguros; no crea reservas.</div>`;const el=document.getElementById('flowMermaid'),status=document.getElementById('mapStatus');el.textContent=flow;if(!window.mermaid){el.className='map-fallback';status.textContent='Mapa en texto: requiere conexión para visualizar el diagrama.';return}try{mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'default',flowchart:{useMaxWidth:true,htmlLabels:true,nodeSpacing:28,rankSpacing:36}});mermaid.run({nodes:[el]}).then(()=>status.textContent='Mapa ajustado al ancho de la página').catch(()=>{el.className='map-fallback';el.textContent=flow;status.textContent='Mapa en texto.'})}catch(e){el.className='map-fallback';el.textContent=flow;status.textContent='Mapa en texto.'}}
function renderContracts(){
  const d=contracts[contractTab];
  const summary=`<p class="intro contract-summary">${escapeHtml(d.summary)}</p>`;
  const switcher=`<div class="viewswitch" role="tablist" aria-label="Vista de la instrucción"><button type="button" role="tab" id="vista-definicion" aria-controls="panel-vista" aria-selected="${contractView===0}" data-view="0"><span class="switch-title">Definición</span><span class="switch-sub">Input, instrucciones y output</span></button><button type="button" role="tab" id="vista-ejemplos" aria-controls="panel-vista" aria-selected="${contractView===1}" data-view="1"><span class="switch-title">Ejemplos</span><span class="switch-sub">Tablas de entrada y salida</span></button></div>`;
  const definition=`<div id="panel-vista" role="tabpanel" aria-labelledby="vista-definicion"><section class="card"><h3>Input</h3><pre>${escapeHtml(JSON.stringify(d.input,null,2))}</pre></section><section class="card prompt"><div class="prompthead"><h3>Instrucciones</h3><button class="copy" type="button" id="copyPrompt">Copiar</button></div><p class="prompttext">${escapeHtml(d.instructions)}</p></section><section class="card"><h3>Output</h3><pre>${escapeHtml(JSON.stringify(d.output,null,2))}</pre></section><div class="notice">Los JSON describen el contrato, no un caso guardado. El id_proceso conecta las evaluaciones de cada recorrido. «No intentada» indica que una vía aún no se investigó.</div></div>`;
  const exampleRows=contractExample===0?inputExamples[d.label]:outputExamples[d.label];
  const exampleSchema=contractExample===0?d.input:d.output;
  const exampleHint=contractExample===0?'Cada fila es un caso de entrada: lo que recibiría este bloque.':'Cada fila es un caso de salida, como quedaría guardado. Un campo anidado se abre en su pestaña, dentro de esa fila.';
  const examples=`<div id="panel-vista" role="tabpanel" aria-labelledby="vista-ejemplos"><div class="sidetabs" role="tablist" aria-label="Tabla de ejemplo"><button type="button" role="tab" aria-selected="${contractExample===0}" data-side="0">Input</button><button type="button" role="tab" aria-selected="${contractExample===1}" data-side="1">Output</button></div><p class="intro">${exampleHint}</p><section class="card">${renderRecordTable(loadExampleRows(d.label, exampleSchema, exampleRows))}</section></div>`;
  content.innerHTML=heading('Propósitos e interfaces','Instrucciones','Dentro de cada bloque, el contrato y las tablas de ejemplo van por separado.','8 instrucciones')+tabs(contracts,contractTab,'contratos')+`<div id="panel-contratos" role="tabpanel" aria-labelledby="contratos-${contractTab}">${summary}${switcher}${contractView===0?definition:examples}</div>`;
  bindTabs('contratos',i=>{contractTab=i;renderContracts()});
  content.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{contractView=Number(b.dataset.view);renderContracts()}));
  content.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{contractExample=Number(b.dataset.side);contractView=1;renderContracts()}));
  const copy=document.getElementById('copyPrompt');
  if(copy) copy.onclick=async()=>{try{await navigator.clipboard.writeText(d.instructions);copy.textContent='Copiado'}catch(e){const t=document.createElement('textarea');t.value=d.instructions;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();copy.textContent='Copiado'}};
}
function renderValidations(){const v=validations[validationTab];content.innerHTML=heading('Pruebas independientes','Validar','Cada bloque de investigación y cada vía tienen una revisión propia. La revisión conserva evidencias, hallazgos y fecha; no sustituye el resultado del bloque revisado.','8 revisiones')+tabs(validations,validationTab,'pruebas')+`<div id="panel-pruebas" role="tabpanel" aria-labelledby="pruebas-${validationTab}"><p class="intro">${escapeHtml(v.intro)}</p><section class="card"><h3>Qué se recibe</h3><p class="intro">${escapeHtml(v.input)}</p></section><section class="card"><h3>Qué se comprueba</h3><ul class="criteria">${v.checks.map(([label,detail])=>`<li><strong>${escapeHtml(label)}.</strong> ${escapeHtml(detail)}</li>`).join('')}</ul></section><div class="notice">${escapeHtml(v.outcome)}</div><section class="card"><h3>Output de la revisión</h3><pre>${escapeHtml(JSON.stringify(validationOutput,null,2))}</pre></section>${exampleSection('Output de la revisión', validationOutput)}</div>`;bindTabs('pruebas',i=>{validationTab=i;renderValidations()})}
function clasificarDeteccion(estado){
 if(estado==='encontrada')return 'procesos_identificados';
 if(estado==='no_encontrada')return 'no_apto';
 if(estado==='pendiente')return 'pendiente';
 throw new Error('Estado de detección no reconocido');
}
function clasificarVias(automatica,asistida){
 const estados=['apta','no_apta','pendiente','no_intentada'];
 if(!estados.includes(automatica)||!estados.includes(asistida))throw new Error('Estado de vía no reconocido');
 if(automatica==='apta')return 'apto_automatico';
 if(asistida==='apta')return 'apto_asistido';
 if(automatica==='no_apta'&&asistida==='no_apta')return 'no_apto';
 return 'pendiente';
}
function renderResult(){
 const etiquetas={apto_automatico:'APTO AUTOMÁTICO',apto_asistido:'APTO ASISTIDO',no_apto:'NO APTO',pendiente:'PENDIENTE'};
 const estadoTexto={apta:'Apta',no_apta:'No apta',pendiente:'Pendiente',no_intentada:'No intentada'};
 const estados=['apta','no_apta','pendiente','no_intentada'];
 const cases=estados.flatMap(a=>estados.map(b=>[a,b]));
 const result={nombre_negocio:'string | null',deteccion:'Output completo revisado',proveedores:[{software:'string',investigacion_integracion:'Output reutilizable revisado'}],procesos:[{id_proceso:'Identificador del proceso',alcance:'Reservas cubiertas',url_reservas:'URL verificada',identificacion_software:'Output revisado',funcion_reserva:'Output revisado | pendiente',script_reserva:'Versión y huella usada',canal_cancelacion:'Output revisado',automatica:'Output revisado',asistida:'Output revisado | no_intentada',verificacion:'Output revisado | pendiente',clasificacion:'apto_automatico | apto_asistido | no_apto | pendiente',fiabilidad_mecanismo:'fiable | requiere_revision | pendiente',oferta:'habilitada | bloqueada_revision | pendiente'}],clasificacion_deteccion:'procesos_identificados | no_apto | pendiente'};
 content.innerHTML=heading('Estados por proceso','Resultado','La ausencia online comprobada se informa aparte. Cada proceso requiere la función de reserva revisada antes de probar las vías; el resultado combinado incluye su versión y verificación, y separa aptitud técnica de fiabilidad vigente.')+`<section class="card"><h3>Resultado de la detección</h3><div class="result-row"><strong>Sin reserva online</strong><span>No encontrada tras revisión concluyente → ${clasificarDeteccion('no_encontrada').replace('_',' ').toUpperCase()} para reserva online.</span></div><div class="result-row"><strong>Búsqueda inconclusa</strong><span>${clasificarDeteccion('pendiente').toUpperCase()}. Un bloqueo o una exploración incompleta no prueban ausencia.</span></div><div class="result-row"><strong>Procesos verificados</strong><span>Identificar software y evaluar cada proceso por separado; la investigación del proveedor se puede reutilizar. Si una revisión decisiva sigue inconclusa, mantener el resultado pendiente. La automática no confirma una prueba real sin canal de cancelación revisado, canal preferido verificado, autorización y plan de gestión.</span></div></section><section class="card"><h3>Cómo se combina cada proceso</h3><p class="intro">Si funcion_reserva no está generada o su revisión no está aprobada, las vías se marcan como "no intentada" y la clasificación es PENDIENTE.</p><div class="tablewrap"><table><thead><tr><th>Automática</th><th>Asistida</th><th>Resultado</th></tr></thead><tbody>${cases.map(([a,b])=>`<tr><td>${estadoTexto[a]}</td><td>${estadoTexto[b]}</td><td><strong>${etiquetas[clasificarVias(a,b)]}</strong></td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>Output combinado</h3><pre>${escapeHtml(JSON.stringify(result,null,2))}</pre>${exampleSection('Output combinado', result)}<p class="intro" style="margin-top:12px">Cada bloque conserva fecha_evaluacion y fecha_validacion; esta última solo se completa tras una revisión concluyente.</p></section><div class="notice">Una vía apta describe capacidad técnica. Alertas abiertas de formulario_cambiado, revisar_script, control_nuevo o fallo_proceso bloquean ofrecerla como fiable hasta resolverlas, sin borrar su aptitud técnica. Un formulario cambiado obliga a regenerar y revisar la función y el script antes de otra ejecución. La reserva de prueba solo puede confirmarse tras aprobar el canal de cancelación y contar con autorización explícita. Ninguna reserva se comunica como confirmada sin confirmación real del sistema.</div>`;
}
const sections=[['Flujo completo',renderFlow],['Configuración',renderConfig],['Instrucciones',renderContracts],['Validar',renderValidations],['Resultado',renderResult]];
function render(){document.getElementById('nav').innerHTML='<div class="navtitle">Arquitectura</div>'+sections.map(([label],i)=>`<button type="button" class="${section===i?'active':''}" aria-current="${section===i?'page':'false'}" data-section="${i}"><span class="num">${i+1}</span>${label}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{section=Number(b.dataset.section);render();window.scrollTo({top:0,behavior:'smooth'})}));sections[section][1]()}
render();
</script>
</body>
</html>
